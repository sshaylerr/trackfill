<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trackfill">
<meta name="theme-color" content="#1c1c1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Trackfill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Trackfill hardware: a matte charcoal body with rubber keys, backlit pads and knobs; data lives in recessed screens.
   Layout is fixed like a device: every region has a set size, nothing wraps, text truncates, numbers use fixed-width digits. */
:root{
  color-scheme: dark;
  /* body & controls */
  --body:#1c1c1f; --body2:#242428; --keyhi:#3b3b41; --keylo:#2a2a2f; --edge:#09090a; --print:#a29d93; --led-off:#3a2f2b;
  /* screen (also used by canvas drawing) */
  --bg:#090c0d; --panel:#0f1415; --raised:#162021; --raised2:#1e2a2b; --line:#233133; --ink:#ece8e0; --mute:#8d9a98; --dim:#4f5b5a;
  /* signal colors */
  --accent:#f2b544; --accent-ink:#241803; --rec:#e5483d; --play:#53d18d; --play-ink:#0a1a11;
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lcd:"Figtree", system-ui, sans-serif;   /* values: same family as the UI, lighter weight, fixed-width digits */
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overscroll-behavior:none;background:var(--body) radial-gradient(140% 70% at 50% 0%,#26262b 0%,var(--body) 60%);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.lcd{font-family:var(--font-lcd);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(8px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}

/* ---------- rubber keys ---------- */
.key,.tb{height:34px;min-width:34px;padding:0 10px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);
  box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);color:var(--ink);font:600 13px/1 var(--font-ui);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;position:relative;overflow:hidden;text-overflow:ellipsis}
.key:active,.tb:active,.key.down{transform:translateY(1px);box-shadow:0 1px 0 #050506,inset 0 1px 0 rgba(255,255,255,.05)}
.key.on{color:var(--accent);background:linear-gradient(180deg,#4a4334,#352f25)}
.key.warn{color:var(--rec)}
.key.sm{height:30px;padding:0 8px;font-size:11.5px;border-radius:4px}
.key.xs{height:26px;min-width:26px;padding:0 7px;font-size:11px;border-radius:3px}
.key.ic{padding:0;width:34px}
.key svg,.tb svg{width:17px;height:17px;fill:currentColor;flex:none}
.key:disabled{opacity:.35}
.key .led{width:6px;height:6px;border-radius:50%;background:var(--led-off);flex:none}
.key.on .led{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.keys{display:inline-flex;gap:4px;flex:none}
.keys .key{min-width:30px;padding:0 7px}
.btn{height:36px;padding:0 12px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);
  font:600 13px var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 #6b4c10}
.btn.warn{color:var(--rec)}
.btn.sm{height:32px;padding:0 9px;font-size:12px}
.btn.xs{height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4}

/* ---------- screens ---------- */
.scr{background:var(--bg);border:1px solid #000;border-radius:5px;box-shadow:inset 0 2px 10px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.lcdbox{height:30px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcdbox span{overflow:hidden;text-overflow:ellipsis}

/* ---------- transport ---------- */
#top{display:flex;align-items:center;gap:5px;flex:none;height:40px}
.tb{height:40px;padding:0 9px;border-radius:4px}
.tb.ic{padding:0;width:38px;min-width:38px}
#bPlay.on{color:var(--play)} #bPlay.on::after,#bRec.on::after,#bRec.armed::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
#bPlay.on::after{background:var(--play);box-shadow:0 0 6px var(--play)}
#bRec{color:var(--rec)} #bRec.armed::after{background:var(--rec);opacity:.6} #bRec.on::after{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.35}}
#bLoop{width:70px} #bTempo{width:56px;flex-direction:column;gap:2px;line-height:1}
#bTempo.clk::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#bTempo b{font:500 14px var(--font-lcd);color:var(--accent)}
#bTempo small{font-size:9px;color:var(--print)}
#bPanel.on{color:var(--accent)}
.spacer{flex:1}
#meter{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 60px 32px;gap:6px;align-items:center;height:12px;cursor:pointer}
#meter .bars{display:flex;flex-direction:column;gap:2px}
#meter .bar{height:3px;border-radius:2px;background:#0b0b0c;overflow:hidden}
#meter .bar i{display:block;height:100%;width:100%;transform:scaleX(0);background:var(--play);transform-origin:left}
#meter .bar i.hot{background:var(--accent)}
#meter .cpu{font-size:8.5px;color:var(--print);text-align:right;white-space:nowrap}
#meter .cpu.hot{color:var(--accent)}
#meter .clip{height:12px;border-radius:3px;background:#0b0b0c;border:1px solid #000;font:700 7px var(--font-lcd);color:var(--dim);display:flex;align-items:center;justify-content:center}
#meter .clip.on{background:var(--rec);color:#2b0707}

/* ---------- scene keys ---------- */
#scenes{display:flex;gap:6px;overflow-x:auto;flex:none;height:50px;scrollbar-width:none;padding-bottom:2px}
#scenes::-webkit-scrollbar{display:none}
.slot{flex:0 0 56px;height:47px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 6px;position:relative;overflow:hidden;text-align:left}
.slot .srow{display:flex;align-items:baseline;gap:4px;max-width:calc(100% - 8px);min-width:0;height:15px}
.slot .num{font:500 14px/14px var(--font-lcd);flex:none}
.slot .mini{display:block;width:44px;height:18px;border-radius:2px;margin-top:4px}
.slot.empty .mini{opacity:.5}
.slot .lbl{font-size:10.5px;min-width:0;font-weight:500;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;height:13px;line-height:13px}
.slot .meta{font:400 9.5px/10px var(--font-lcd);color:var(--dim);white-space:nowrap}
.slot .led{position:absolute;right:6px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
.slot.filled .led{background:var(--accent);box-shadow:0 0 5px var(--accent)}
.slot.empty .num{color:var(--dim)}
.slot.sel{background:linear-gradient(180deg,#4a4334,#352f25)} .slot.sel .num{color:var(--accent)}
.slot.playing .led{background:var(--play);box-shadow:0 0 6px var(--play)}
.slot .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--play);width:0}

/* ---------- view & mode keys ---------- */
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#soundChip{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;height:42px}
#tabs button{height:40px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  font:600 13px var(--font-ui);color:var(--print);display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;white-space:nowrap;min-width:0}
#tabs button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
#tabs button.on{color:var(--ink)} #tabs button.on::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* ---------- knobs, selectors, faders ---------- */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:80px;gap:6px 4px;flex:none}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;min-width:0;padding:3px 2px;border-radius:4px;position:relative}
.knob svg{width:48px;height:48px;display:block}
.knob .kr{fill:none;stroke:#0b0b0c;stroke-width:4;stroke-dasharray:75 100;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 2px rgba(242,181,68,.55))}
.knob .kb{fill:url(#knobFace);stroke:#060607;stroke-width:1}
.knob .ki{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.knob .kval{font:400 11px var(--font-lcd);color:var(--ink);white-space:nowrap;height:13px;line-height:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.knob .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;line-height:13px}
.knob.mini svg{width:30px;height:30px}.knob.mini .kval,.knob.mini .klab{display:none}
.nf{outline:2px solid var(--accent)!important;outline-offset:-2px}
.ne{outline:2px solid var(--play)!important;outline-offset:-2px;background-color:rgba(83,209,141,.08)}
.knob.nf,.knob.ne,.selr.nf,.selr.ne,.fader.nf,.fader.ne{border-radius:4px}
.knob.drag .kv{stroke:#ffd27a}
.knob.autoed .klab{color:var(--accent)}
.knob.blank{visibility:hidden}
.selr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 2px;border-radius:8px;min-width:0;touch-action:none}
.selr .sw>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.2}
.selr .sw{height:34px;width:100%;max-width:72px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;
  font:400 11.5px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;margin-top:9px}
.selr .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;margin-top:2px}
.param{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px 10px;touch-action:pan-y;min-width:0}
.param .prow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.param .plab{font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param .pval{font-size:11px;white-space:nowrap}
.param .ptrack{height:5px;border-radius:3px;background:#000;margin-top:9px;position:relative;overflow:hidden}
.param .pfill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
.param.drag{border-color:var(--accent)}
.fader{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-height:0;width:100%;touch-action:none;border-radius:4px;padding:4px 3px 3px}
.fader .fval{font:400 9.5px var(--font-lcd);color:var(--ink);height:11px;line-height:11px;white-space:nowrap}
.fader .ftrack{flex:1;min-height:24px;width:100%;position:relative;display:flex;justify-content:center;gap:3px}
.fader .fmeter{width:5px;height:100%;border-radius:2px;background:#000;position:relative;overflow:hidden}
.fader .fmeter i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--play) 0%,var(--play) 70%,var(--accent) 88%,var(--rec) 100%);background-size:100% var(--mh,100px);background-position:bottom}
.fader .fslot{width:4px;height:100%;border-radius:2px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.fader .funity{position:absolute;left:8%;right:8%;height:1px;background:var(--dim)}
.fader .fcap{position:absolute;left:50%;width:30px;height:16px;margin-left:-11px;border-radius:2px;background:linear-gradient(180deg,#55555c,#33333a 45%,#2a2a2f);border:1px solid #050506;box-shadow:0 2px 3px rgba(0,0,0,.6)}
.fader .fcap::after{content:"";position:absolute;left:3px;right:3px;top:7px;height:1px;background:var(--ink)}
.fader.drag .fcap::after{background:var(--accent)}

/* ---------- pads ---------- */
.padsView{height:100%;display:flex;flex-direction:column;gap:10px}
.toolbar{display:flex;gap:6px;align-items:center;flex:none;height:34px;flex-wrap:nowrap;min-width:0}
.toolbar .lcdbox{flex:1 1 0}
.toolbar{overflow:hidden}.toolbar .key.sm{padding:0 7px}
.padsView{container-type:inline-size;padding-bottom:3px}
@media (max-width:420px){.padsSel{display:none!important}}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 0;min-height:0;width:100%;max-height:calc(100cqw * 1.45);margin:auto 0}
.pad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;
  box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px 15px;position:relative;touch-action:none;min-width:0;min-height:0;overflow:hidden}
.pad::after{content:"";position:absolute;left:7px;right:7px;bottom:6px;height:3px;border-radius:1px;background:color-mix(in srgb,var(--pc) 38%,#101012);transition:background .25s,box-shadow .25s}
.pad .pn{font:400 10.5px var(--font-lcd);color:var(--print);position:relative;white-space:nowrap;overflow:hidden}
.pad .nm{font:600 13px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;height:15px;line-height:15px}
.pad.empty{background:linear-gradient(180deg,#2a2a2e,#232326)} .pad.empty::after{background:#17171a}
.pad.empty .nm{color:var(--dim)}
.pad.sel{border-color:#070708;box-shadow:0 3px 0 #050506,inset 0 0 0 1px #8a6a2a} .pad.sel .pn{color:var(--accent)}
.pad.hit{transform:translateY(2px);box-shadow:0 1px 0 #050506,inset 0 1px 0 rgba(255,255,255,.05);background:linear-gradient(180deg,#38383e,#2e2e33)}
.pad.hit::after{transition:none;background:var(--pc);box-shadow:0 0 8px var(--pc),0 0 2px #fff}
.pad.has .pn::after{content:"";display:inline-block;width:5px;height:5px;border-radius:1px;background:var(--pc);margin-left:5px;vertical-align:1px}
.pad.frz .nm::before{content:"❄ ";}
.pad.kp .nm{font:500 14px var(--font-lcd);text-transform:none}
/* ---------- timeline ---------- */
.seqView{height:100%;display:flex;flex-direction:column;gap:8px}
.lanebox{height:34px;flex:1 1 0;min-width:0;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8);display:flex;align-items:center;gap:6px;padding:0 8px;text-align:left}
.lanebox b{font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lanebox i{font-style:normal;color:var(--mute);font-size:10px;flex:none}
.tlwrap{flex:1;min-height:120px}
.tlwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- sound ---------- */
.soundView,.fxView,.mixView{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}
.shead{display:flex;gap:6px;align-items:center;flex:none;height:34px}
.shead input,.textin{height:34px;width:100%;min-width:0;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8);padding:0 10px;font:500 16px var(--font-lcd);color:var(--accent)}
.textin{font-family:var(--font-ui);font-size:16px;color:var(--ink)}
.disp{flex:1;min-height:90px}
.disp canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

#view.short .kgrid{grid-auto-rows:64px;gap:2px 4px}
#view.short .knob svg{width:38px;height:38px} #view.short .knob .kval{font-size:9.5px}
#view.short .selr .sw{height:28px;margin-top:4px}
#view.short .disp{min-height:0}
#view.tiny .disp{min-height:44px}
.chopView{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.chopwave{flex:1;min-height:90px;position:relative}
.chopwave canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zbtns{position:absolute;right:5px;bottom:20px;display:flex;gap:4px}
.zbtns .key{height:26px;min-width:30px;padding:0 6px;opacity:.9}
.spads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:36px;gap:6px 5px;flex:none}
.spad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;color:var(--mute);font:400 12px var(--font-lcd);padding:0 0 7px;min-width:0;touch-action:none}
.spad::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:1px;background:color-mix(in srgb,var(--pc) 45%,#101012);transition:background .25s,box-shadow .25s}
.spad.on{color:var(--accent);box-shadow:0 3px 0 #050506,inset 0 0 0 1px #8a6a2a}
.spad.hit{transform:translateY(2px);box-shadow:0 1px 0 #050506}
.spad.hit::after{transition:none;background:var(--pc);box-shadow:0 0 8px var(--pc),0 0 2px #fff}
.spad:disabled{opacity:.3}
.spads .chopgo,.spads .spempty{grid-column:1/-1;grid-row:span 2;height:auto}
.spempty{display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;text-align:center}
#view.short .spads{grid-auto-rows:30px;gap:5px}
#view.short .chopwave{min-height:60px}
#view.tiny .chopwave{display:block}
#view.tiny .spads{grid-auto-rows:22px;gap:3px 4px}
#view.tiny .spad{font-size:10px;padding-bottom:5px}
.padsView.chopping .chopwave{flex:0 0 30%;min-height:96px}
.padsView.chopping .grid{max-height:none}
#view.tiny .padsView .chopwave{flex-basis:20%;min-height:44px}
#view.tiny .padsView.chopping .pad{padding:4px 7px 9px}
#view.tiny .padsView.chopping .pad .pn{display:none}
#view.tiny .padsView.chopping .pad .nm{font-size:12px}
#view.short .detail .dk{grid-template-columns:repeat(3,52px)}
#view.short .detail .knob .kval{font-size:9px;height:11px;line-height:11px}
#view.short .strip .knob.mini svg{width:22px;height:22px}
#view.short .strip .knob.mini{padding:0 2px}
#view.short .strip{gap:3px}
#view.tiny .detail .dk{grid-template-columns:repeat(3,34px);gap:2px}
#view.tiny .detail .knob svg{width:30px;height:30px}

/* ---------- effects ---------- */
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;flex:none}
.slots .key{width:100%;min-width:0;padding:0 2px;height:40px;flex-direction:column;gap:3px;font-size:10px}
.slots .key .led{position:absolute;top:4px;right:4px;width:5px;height:5px}
.slots .key.lit .led{background:var(--play);box-shadow:0 0 5px var(--play)}
.slots .key.cur{border-color:var(--accent);color:var(--accent)}
.fxPanel{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain}
.fxHead{display:flex;gap:6px;align-items:center;flex:none;height:30px}
.fxHead .lcdbox{flex:1 1 0}

/* ---------- mixer ---------- */
.pages{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:3px;flex:none}
.pages .key{width:100%;min-width:0;padding:0;height:28px;font-size:10px}
.console{flex:1;min-height:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:2px;padding:6px 3px 4px}
.strip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;min-height:0;overflow:hidden;border-radius:3px;padding:3px 1px;border:1px solid transparent}
.strip.sel{border-color:var(--line);background:var(--panel)}
.strip.sel .sname b{color:var(--accent)}
.strip.empty{opacity:.4}
.sname{display:flex;flex-direction:column;align-items:center;width:100%;min-width:0;height:26px;line-height:12px}
.sname em{font:400 9.5px var(--font-lcd);font-style:normal;color:var(--mute)}
.sname b{font:600 11px var(--font-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sname i{display:block;width:70%;height:2px;border-radius:1px;margin-top:1px}
.ms2{display:flex;gap:2px;width:100%;justify-content:center}
.ms2 button{width:19px;height:19px;border-radius:2px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid #050506;font:700 9px var(--font-ui);color:var(--print)}
.ms2 button.m.on{background:var(--rec);color:#2b0707} .ms2 button.s.on{background:var(--accent);color:var(--accent-ink)}
.detail{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.detail .dk{display:grid;grid-template-columns:repeat(3,64px);gap:4px;justify-content:end}
.detail .dbtns{display:flex;flex-direction:column;gap:5px;min-width:0}
.detail .dbtns .key{width:100%;justify-content:flex-start}

.scopebox span,.scopebox i{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scopebox i{flex:none;display:flex;color:var(--mute)} .scopebox i svg{width:14px;height:14px;fill:currentColor}
.anbox{height:min(240px,34vh)} .anbox canvas,.fxvis canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.anread{font-size:12px;color:var(--ink);margin-top:8px}
.fxvis{flex:none;height:112px;margin-bottom:8px}

/* ---------- lists in sheets ---------- */
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:44px}
.li .lt{flex:1;min-width:0;text-align:left}
.li .lt b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.note{color:var(--mute);font-size:13px;line-height:1.45;margin:8px 2px}
.stack{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row{display:flex;gap:6px;align-items:center}
.diag{display:flex;flex-direction:column;gap:6px}

#panel{flex:none;height:168px;background:linear-gradient(180deg,var(--body2),var(--body));border:1px solid var(--edge);border-radius:6px;padding:8px 10px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

.pact{display:flex;gap:8px;align-items:center}
.pact .pk{width:56px;height:56px;border-radius:5px}
#pOk{background:linear-gradient(180deg,#ffcf6e,var(--accent) 55%,#c88d22);color:var(--accent-ink);box-shadow:0 2px 0 #5c4210}

/* ---------- sheet + toast ---------- */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(3,4,5,.62);display:flex;align-items:flex-end;justify-content:center}
#sheet .card{width:100%;max-width:780px;max-height:84%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#121617;border:1px solid #000;border-bottom:0;border-radius:8px 8px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(18px + env(safe-area-inset-bottom,0px))}
.shTitle{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.shTitle span{font-size:18px;font-weight:700;text-wrap:balance}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#111;font-weight:600;font-size:13.5px;padding:9px 14px;border-radius:9px;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}

<script>
'use strict';
/* Trackfill project model: built-in sounds, effect definitions, project format (v2) and migration.
   Shared by the app and the automated tests. */

const NPADS = 64, NSCENES = 16, NCHANS = 83, G0 = 64, B0 = 72, R0 = 80, MASTER = 82, NSLOTS = 8, MAX_DUCKERS = 8, BAR = 384, BEAT = 96;
const BANKS = 'ABCD';
const PROJECT_VERSION = 2;

/* ---------- built-in sounds (synthesized, deterministic) ---------- */
const KIT_SR = 44100;
let rngS = 1;
const noise = () => { rngS ^= rngS << 13; rngS ^= rngS >>> 17; rngS ^= rngS << 5; return ((rngS >>> 0) / 4294967296) * 2 - 1; };
function gen(sec, fn) { const a = new Float32Array(Math.floor(sec * KIT_SR)); for (let i = 0; i < a.length; i++) a[i] = fn(i / KIT_SR); return a; }
function finish(a, peak = 0.9, fade = 0.004) {
  let m = 0; for (let i = 0; i < a.length; i++) { const x = Math.abs(a[i]); if (x > m) m = x; }
  if (m > 0) { const k = peak / m; for (let i = 0; i < a.length; i++) a[i] *= k; }
  const n = Math.min(a.length, Math.floor(fade * KIT_SR)); for (let i = 0; i < n; i++) a[a.length - 1 - i] *= i / n;
  return a;
}
function biquad(type, f, q) {
  const w = 2 * Math.PI * f / KIT_SR, cs = Math.cos(w), sn = Math.sin(w), al = sn / (2 * q); let b0, b1, b2;
  if (type === 'lp') { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = (1 - cs) / 2; } else if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = (1 + cs) / 2; } else { b0 = al; b1 = 0; b2 = -al; }
  const a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al, B0 = b0 / a0, B1 = b1 / a0, B2 = b2 / a0, A1 = a1 / a0, A2 = a2 / a0; let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  return x => { const y = B0 * x + B1 * x1 + B2 * x2 - A1 * y1 - A2 * y2; x2 = x1; x1 = x; y2 = y1; y1 = y; return y; };
}
const SOUNDS = {
  kick() { let ph = 0; return finish(gen(.55, t => { ph += 2 * Math.PI * (46 + 110 * Math.exp(-t * 30)) / KIT_SR; return Math.tanh(1.6 * Math.sin(ph) * Math.exp(-t * 6)) + (t < .003 ? noise() * .3 : 0); })); },
  snare() { const hp = biquad('hp', 1500, .7); let ph = 0; return finish(gen(.32, t => { ph += 2 * Math.PI * (185 + 60 * Math.exp(-t * 50)) / KIT_SR; return hp(noise()) * .75 * Math.exp(-t * 15) + Math.sin(ph) * .6 * Math.exp(-t * 25); })); },
  clap() { const bp = biquad('bp', 1150, 1.4); return finish(gen(.4, t => { let e = 0; for (const o of [0, .011, .023]) if (t >= o) e += Math.exp(-(t - o) * 170); if (t > .03) e += .55 * Math.exp(-(t - .03) * 13); return bp(noise()) * e; })); },
  chat() { const hp = biquad('hp', 7500, .8); return finish(gen(.11, t => hp(noise()) * Math.exp(-t * 48)), .7); },
  ohat() { const hp = biquad('hp', 6800, .8); return finish(gen(.55, t => hp(noise()) * Math.exp(-t * 6.5)), .6, .03); },
  rim() { const bp = biquad('bp', 1800, 6); return finish(gen(.09, t => bp(t < .002 ? noise() : 0) * 3 + Math.sin(2 * Math.PI * 820 * t) * Math.exp(-t * 70) * .5), .8); },
  tom() { let ph = 0; return finish(gen(.5, t => { ph += 2 * Math.PI * (92 + 70 * Math.exp(-t * 22)) / KIT_SR; return Math.sin(ph) * Math.exp(-t * 7); })); },
  shake() { const hp = biquad('hp', 5200, .7); return finish(gen(.15, t => hp(noise()) * (t < .018 ? t / .018 : Math.exp(-(t - .018) * 34))), .55); },
  '808'() { let ph = 0; return finish(gen(1.6, t => { ph += 2 * Math.PI * (65.41 * (1 + .25 * Math.exp(-t * 25))) / KIT_SR; return Math.tanh(1.3 * Math.sin(ph)) * Math.exp(-t * 1.6); }), .9, .05); },
  bass() { const lp = biquad('lp', 700, 1.1), lp2 = biquad('lp', 900, .7); let p1 = 0, p2 = 0; const f = 65.41;
    return finish(gen(2.2, t => { p1 = (p1 + f / KIT_SR) % 1; p2 = (p2 + f * 1.006 / KIT_SR) % 1; const s = (p1 * 2 - 1) + (p2 * 2 - 1) * .7; return lp2(lp(s)) * (t < .005 ? t / .005 : 1) * (.6 + .4 * Math.exp(-t * 5)); }), .85, .08); },
  stab() { const fr = [261.63, 311.13, 392, 466.16]; return finish(gen(1.3, t => { let s = 0; for (const f of fr) s += Math.sin(2 * Math.PI * f * t) + .35 * Math.sin(4 * Math.PI * f * t) * Math.exp(-t * 6); return s * Math.exp(-t * 3.2) * (t < .004 ? t / .004 : 1); }), .8, .05); },
  pluck() { const N = Math.round(KIT_SR / 261.63), ring = new Float32Array(N); for (let i = 0; i < N; i++) ring[i] = noise(); let idx = 0;
    return finish(gen(1.6, () => { const nx = (idx + 1) % N, v = ring[idx]; ring[idx] = (v + ring[nx]) * .4985; idx = nx; return v; }), .8, .05); },
  pad() { const fr = [130.81, 155.56, 196, 261.63], ph = fr.map(() => [(noise() + 1) / 2, (noise() + 1) / 2]), lp = biquad('lp', 1600, .7), L = 3.6;
    return finish(gen(L, t => { let s = 0; for (let k = 0; k < fr.length; k++) { const f = fr[k]; ph[k][0] = (ph[k][0] + f * .996 / KIT_SR) % 1; ph[k][1] = (ph[k][1] + f * 1.004 / KIT_SR) % 1; s += ph[k][0] + ph[k][1] - 1; } return lp(s) * Math.min(1, t / .5) * Math.min(1, (L - t) / .8); }), .7, .02); },
  bell() { const fc = 523.25; return finish(gen(2.6, t => { const I = 3.5 * Math.exp(-t * 2.5); return Math.sin(2 * Math.PI * fc * t + I * Math.sin(2 * Math.PI * fc * 3.5 * t)) * Math.exp(-t * 1.7) * (t < .002 ? t / .002 : 1); }), .75, .05); },
  vox() { const f0 = 130.81, bps = [[800, 9, 1], [1150, 10, .55], [2900, 12, .25]].map(([f, q, g]) => [biquad('bp', f, q), g]); let ph = 0; const L = 1.6;
    return finish(gen(L, t => { ph = (ph + f0 * (1 + .006 * Math.sin(2 * Math.PI * 5.2 * t) * Math.min(1, t / .3)) / KIT_SR) % 1; const src = ph * 2 - 1; let s = 0; for (const [b, g] of bps) s += b(src) * g; return s * Math.min(1, t / .07) * Math.min(1, (L - t) / .25); }), .8, .02); },
  rise() { let lo = 0, bp = 0; const L = 2.6; return finish(gen(L, t => { const f = 250 * Math.pow(28, t / L), F = 2 * Math.sin(Math.PI * Math.min(f, KIT_SR / 6) / KIT_SR), hi = noise() - lo - .25 * bp; bp += F * hi; lo += F * bp; return bp * Math.pow(t / L, 1.5) * Math.min(1, (L - t) / .05); }), .7, .01); },
};
// time-varying state-variable filter for moving basses (stable below ~fs/6)
function svfMod() { let lo = 0, bp = 0; return (x, f, q) => { const F = 2 * Math.sin(Math.PI * Math.min(f, KIT_SR / 6.5) / KIT_SR), hi = x - lo - q * bp; bp += F * hi; lo += F * bp; return { lo, bp, hi }; }; }
const saw = ph => ph * 2 - 1;
function metal(t, f0) { let s = 0; for (const r of [1, 1.342, 1.2312, 1.6532, 1.9523, 2.1523]) s += Math.sin(2 * Math.PI * f0 * r * t) > 0 ? 1 : -1; return s / 6; }
Object.assign(SOUNDS, {
  dkick() { let ph = 0; const hp = biquad('hp', 2500, .7); return finish(gen(.42, t => { ph += 2 * Math.PI * (48 + 190 * Math.exp(-t * 55) + 40 * Math.exp(-t * 9)) / KIT_SR;
    return Math.tanh(2.4 * Math.sin(ph) * Math.exp(-t * 7.5) * (t < .001 ? t / .001 : 1)) + (t < .004 ? hp(noise()) * .5 * (1 - t / .004) : 0); }), .95); },
  dsnare() { const bp = biquad('bp', 4200, .9), hp = biquad('hp', 1800, .7); let p1 = 0, p2 = 0;

const WORKLET_SRC = "'use strict';\n/* Trackfill engine host.\n   Runs inside the AudioWorklet for live playback, and on the main thread for exports, bounces and freezes,\n   so every path produces identical audio. It owns a copy of the song plus sequencing, automation, routing\n   and solo logic. The WASM module (engine.cpp) does all per-sample work.\n\n   Timing: a lookahead cursor runs 20 ms ahead of the audio and pushes timestamped events into a heap.\n   That lets note-triggered duckers start before the note itself (true lookahead, no added latency). */\n\nconst TF = { PPQ: 96, BAR: 384, NCH: 83, NPAD: 64, G0: 64, B0: 72, R0: 80, MASTER: 82, NSLOT: 8, SUB: 16,\n  FRZ_TAG: 1 << 20, PREVIEW_TAG: (1 << 20) - 1, CLICK_TAG: (1 << 20) - 2 };\n\n/* ---------- shared math (must match engine.cpp) ---------- */\nfunction tfBezFast(x, w) {\n  const k = 2 - 2 * w, A = x * k - 1, B = -x * k, C = x; let d = B * B - 4 * A * C; if (d < 0) d = 0;\n  const den = -B + Math.sqrt(d); let s;\n  if (den > 1e-12) s = 2 * C / den; else if (Math.abs(A) > 1e-12) s = (-B - Math.sqrt(d)) / (2 * A); else s = x;\n  s = s < 0 ? 0 : s > 1 ? 1 : s;\n  const D = (1 - s) * (1 - s) + 2 * w * s * (1 - s) + s * s;\n  return (2 * w * s * (1 - s) + s * s) / D;\n}\nfunction tfCurve(x, c) {\n  if (!c || x <= 0 || x >= 1) return x;\n  const a = Math.min(0.97, Math.abs(c)), w = a / (1 - a);\n  return c < 0 ? tfBezFast(x, w) : 1 - tfBezFast(1 - x, w);\n}\nfunction tfValueAt(pts, t) {\n  if (!pts || !pts.length) return null;\n  if (t <= pts[0].t) return pts[0].v;\n  const L = pts[pts.length - 1]; if (t >= L.t) return L.v;\n  let lo = 0, hi = pts.length - 1;\n  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (pts[m].t <= t) lo = m; else hi = m; }\n  const a = pts[lo], b = pts[hi];\n  return a.v + (b.v - a.v) * tfCurve((t - a.t) / Math.max(1e-9, b.t - a.t), a.c || 0);\n}\nfunction tfSwing(t, sw) { const r = ((t % 48) + 48) % 48; return Math.abs(r - 24) < 1e-4 ? sw * 12 : 0; }\nfunction tfDest(P, c) {\n  if (c === TF.MASTER) return -1;\n  const o = P.chans[c].out;\n  if (c < TF.G0) return (o >= TF.G0 && o < TF.R0) || o === TF.MASTER ? o : TF.MASTER;\n  if (c < TF.B0) return (o >= TF.B0 && o < TF.R0) || o === TF.MASTER ? o : TF.MASTER;\n  return TF.MASTER;\n}\n// Automation / parameter keys: \"channel.slot.index\". slot -1 = channel strip (vol, pan, send A, send B),\n// slot -2 = pad sound (cutoff, resonance), slot 0..7 = insert effect parameter.\nfunction tfParseKey(k) { const a = k.split('.'); return { c: +a[0], s: +a[1], i: +a[2] }; }\nfunction tfBase(P, k) {\n  const { c, s, i } = tfParseKey(k), C = P.chans[c]; if (!C) return null;\n  if (s === -1) return [C.vol, C.pan, C.sa, C.sb][i];\n  if (s === -2) { const p = P.pads[c]; return p ? [p.cut, p.res][i] : null; }\n  const f = C.fx[s]; return f ? f.p[i] : null;\n}\nfunction tfSetBase(P, k, v) {\n  const { c, s, i } = tfParseKey(k), C = P.chans[c]; if (!C) return;\n  if (s === -1) C[['vol', 'pan', 'sa', 'sb'][i]] = v;\n  else if (s === -2) { const p = P.pads[c]; if (p) p[['cut', 'res'][i]] = v; }\n  else if (C.fx[s]) C.fx[s].p[i] = v;\n}\nfunction tfHasNotes(sc) { for (const k in sc.notes) if (sc.notes[k].length) return true; return false; }\n\n/* ---------- analyzer: 2048-point FFT folded into 64 log-spaced bands (25 Hz to 20 kHz), in dBFS ---------- */\nclass TFSpectrum {\n  constructor(sr) {\n    const N = this.N = 2048; this.re = new Float32Array(N); this.im = new Float32Array(N); this.out = new Float32Array(64);\n    this.win = new Float32Array(N); for (let i = 0; i < N; i++) this.win[i] = .5 - .5 * Math.cos(2 * Math.PI * i / (N - 1));\n    this.rev = new Uint16Array(N); for (let i = 0, j = 0; i < N; i++) { this.rev[i] = j; let b = N >> 1; while (j & b) { j ^= b; b >>= 1; } j |= b; }\n    this.cs = new Float32Array(N / 2); this.sn = new Float32Array(N / 2); for (let i = 0; i < N / 2; i++) { this.cs[i] = Math.cos(2 * Math.PI * i / N); this.sn[i] = -Math.sin(2 * Math.PI * i / N); }\n    this.k0 = new Uint16Array(6   const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }, f = UI.fine;
  if (map[e.key]) { e.preventDefault(); if (e.altKey) UI.fine = Math.max(1, f); navArrow(map[e.key], e.shiftKey || UI.shift); UI.fine = f; }
  else if (e.key === 'Enter') { e.preventDefault(); if (!e.repeat) navOk(true); }
  else if (e.key === 'Escape') { e.preventDefault(); navBack(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); navDel(); }
  else return; updatePanel(); });
addEventListener('keyup', e => { if (e.key === 'Enter' && e.target.tagName !== 'INPUT') { navOk(false); updatePanel(); } });

/* ================= meter, transport wiring & frame loop ================= */
const METER = { l: 0, r: 0, clip: false };
const meterEls = [...document.querySelectorAll('#meter .bar i')], clipEl = document.querySelector('#meter .clip'), cpuEl = document.querySelector('#meter .cpu');
let lastCpuDraw = 0;
const meterLast = [-1, -1];
function drawMeter() { [METER.l, METER.r].forEach((v, i) => { const db = v > 1e-5 ? 20 * Math.log10(v) : -99, f = Math.round(clamp((db + 48) / 48, 0, 1) * 200) / 200; if (f === meterLast[i]) return; meterLast[i] = f;   // write the style only when it changes
    meterEls[i].style.transform = `scaleX(${f})`; meterEls[i].classList.toggle('hot', db > -3); }); clipEl.classList.toggle('on', METER.clip);
  const n = performance.now(); if (n - lastCpuDraw > 400) { lastCpuDraw = n; const c = ENG.ready ? Math.round(REP.cpu * 100) : null; cpuEl.textContent = c == null ? 'CPU —' : `CPU ${c}%`; cpuEl.classList.toggle('hot', c != null && c > 60); } }
$('#meter').addEventListener('click', () => { METER.clip = false; drawMeter(); });
$('#bPlay').onclick = play;
$('#bRec').onclick = () => { T.rec = !T.rec; sendClick(); if (T.rec && T.playing) pushUndo('all'); updateTransport(); if (T.rec && !T.playing) toast('Record armed. Press play, then play pads or move controls.'); };
$('#bLoop').onclick = () => { T.loop = T.loop === 'scene' ? 'song' : 'scene'; send({ t: 'loop', v: T.loop }); updateTransport(); savePrefs(); toast(T.loop === 'song' ? 'Song mode: scenes play in order with repeats' : 'Scene mode: the selected scene loops'); };
$('#bTempo').onclick = openTempo; $('#bUndo').onclick = undo; $('#bPanel').onclick = togglePanel; $('#bMenu').onclick = openMenu;
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => setView(b.dataset.v));
document.addEventListener('pointerdown', ensureAudio, true);
for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1 || !e.target.closest('#sheet .card, #scenes, .fxPanel')) e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', () => { if (ctx && ctx.state !== 'running') ctx.resume().catch(() => {}); }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) { saveNow(); if (T.playing) stop(); if (mediaTag) mediaTag.pause(); } });
new ResizeObserver(() => { const V = $('#view'), hh = V.clientHeight; V.classList.toggle('short', hh < 470); V.classList.toggle('tiny', hh < 360); if (UI.view === 'seq') sizeTL(); else if (UI.view === 'sound') drawDisp(); else if (UI.view === 'mix') UI.regs.forEach(f => f.upd && f.upd()); if (UI.panel) updatePanel(); }).observe($('#view'));
let lastHeard = -1;
// the screen loop runs only while something moves (playback, sound, meters falling, a recent touch); wake() restarts it
let frameOn = false, lastFrame = 0, wakeAt = 0;
function wake() { wakeAt = performance.now(); if (!frameOn) { frameOn = true; requestAnimationFrame(frame); } }
function frame(ts) {
  if (!P) { requestAnimationFrame(frame); return; }
  if (ts - lastFrame < 14) { requestAnimationFrame(frame); return; } lastFrame = ts;   // ~60 fps is plenty for meters and playheads, even on a 120 Hz screen
  METER.l *= .97; METER.r *= .97; drawMeter();
  const scoping = scopeMoving(); if (scoping) scopeFrame(Math.min(.1, (ts - (frame.prev || ts)) / 1000)); frame.prev = ts;
  const busy = scoping || T.playing || METER.l > 1e-4 || METER.r > 1e-4 || REP.voices > 0 || performance.now() - wakeAt < 1500 || (UI.view === 'mix' && STRIP_METERS.some(m => m.v > 1e-4));
  if (busy) requestAnimationFrame(frame); else { frameOn = false; return; }   // nothing moving: stop drawing until woken
  if (!ctx) return;
  if (UI.view === 'mix') for (const m of STRIP_METERS) { const pk = REP.cm[m.c] || 0; m.v = Math.max(pk, m.v * .9); const db = m.v > 1e-5 ? 20 * Math.log10(m.v) : -99, f = clamp((db + 48) / 54, 0, 1);
    m.el.style.height = (f * 100).toFixed(1) + '%'; m.el.style.background = db > 0 ? COL.rec : db > -6 ? COL.accent : COL.play; }
  const pos = heardPos();
  if (pos) {
    if (pos.scene !== lastHeard) { lastHeard = pos.scene; if (pos.scene !== UI.scene && !TL.drag) { UI.scene = pos.scene; UI.tl.sel = null; UI.tl.selPt = -1; UI.tl.sx = 0; renderScenes(); if (UI.view === 'pads') refreshPadDots(); else if (UI.view === 'seq') renderView(); } }
    updatePlayingSlot(pos);
    if (UI.view === 'seq' && pos.scene === UI.scene && !TL.drag) { const x = t2x(pos.tick); if (x > TL.W - 4 || x < LABEL_W) UI.tl.sx = Math.floor(pos.tick / BAR) * BAR; }
    if (UI.view === 'seq') drawTL();
  } else if (lastHeard !== -1) { lastHeard = -1; updatePlayingSlot(null); }
}

/* ================= boot ================= */
async function boot() {
  readColors(); buildBuiltins(); await DB.open();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
  const saved = await DB.get('kv', 'project');
  for (const s of await DB.all('samples')) { const r = upgradeSampleRecord(s); if (r) { SAMPLES.set(r.id, r); if (r !== s) DB.put('samples', r.id, r); } }
  P = saved ? migrate(saved) : demoProject(); ensureBuiltinsFor(P);
  const pr = await DB.get('kv', 'ui');
  if (pr) { UI.view = pr.view || 'pads'; UI.bank = pr.bank || 0; UI.pad = pr.pad || 0; UI.scene = pr.scene || 0; UI.mirror = !!pr.mirror; UI.haptics = pr.haptics !== false; UI.panel = !!pr.panel; T.loop = pr.loop || 'scene'; if (pr.snap != null) UI.tl.snap = pr.snap;
    UI.click = ['off', 'rec', 'always'].includes(pr.click) ? pr.click : 'rec'; UI.countIn = [0, 1, 2].includes(pr.countIn) ? pr.countIn : 1; UI.clickVol = clamp(+pr.clickVol || .5, 0, 1); }
  $('#panel').classList.toggle('mirror', UI.mirror); $('#panel').hidden = !UI.panel; $('#bPanel').classList.toggle('on', UI.panel);
  renderAll(); wake(); markDirty();
  if (!DB.ok) setTimeout(() => toast('This browser is not keeping your work between visits. Save a backup from the menu.'), 1200);
}
boot();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const had = !!navigator.serviceWorker.controller, t0 = Date.now();
  navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had) return;
    if (Date.now() - t0 < 20000 && !T.playing && !UI.sheet) { try { saveNow(); } catch (e) {} toast('Updating Trackfill…'); setTimeout(() => location.reload(), 700); }
    else toast('An update is ready: close and reopen Trackfill to use it');
  });
}
