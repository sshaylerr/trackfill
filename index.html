<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trackfill">
<meta name="theme-color" content="#1c1c1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Trackfill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Trackfill hardware: a matte charcoal body with rubber keys, backlit pads and knobs; data lives in recessed screens.
   Layout is fixed like a device: every region has a set size, nothing wraps, text truncates, numbers use fixed-width digits. */
:root{
  color-scheme: dark;
  /* body & controls */
  --body:#1c1c1f; --body2:#242428; --keyhi:#3b3b41; --keylo:#2a2a2f; --edge:#09090a; --print:#a29d93; --led-off:#3a2f2b;
  /* screen (also used by canvas drawing) */
  --bg:#0a0a0b; --panel:#111113; --raised:#19191c; --raised2:#222226; --line:#2c2b30; --ink:#ece8e0; --mute:#9b968d; --dim:#56534e; --sheet:#141416; --glow:#26262b;
  /* signal colors */
  --accent:#f2b544; --accent-ink:#241803;
  /* shades of the accent, so a theme only needs to set --accent and --accent-ink */
  --accent-hi:color-mix(in srgb,var(--accent) 62%,#fff); --accent-lo:color-mix(in srgb,var(--accent) 72%,#000); --accent-deep:color-mix(in srgb,var(--accent) 34%,#000);
  --accent-ring:color-mix(in srgb,var(--accent) 52%,#111); --accent-glow:color-mix(in srgb,var(--accent) 55%,transparent);
  --on1:color-mix(in srgb,var(--accent) 22%,#38362f); --on2:color-mix(in srgb,var(--accent) 16%,#2a2722); --rec:#e5483d; --play:#53d18d; --play-ink:#0a1a11;
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lcd:"Figtree", system-ui, sans-serif;   /* values: same family as the UI, lighter weight, fixed-width digits */
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overscroll-behavior:none;background:var(--body) radial-gradient(140% 70% at 50% 0%,var(--glow) 0%,var(--body) 60%);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.lcd{font-family:var(--font-lcd);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(8px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}

/* ---------- rubber keys ---------- */
.key,.tb{height:34px;min-width:34px;padding:0 10px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);
  box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);color:var(--ink);font:600 13px/1 var(--font-ui);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;position:relative;overflow:hidden;text-overflow:ellipsis}
.key:active,.tb:active,.key.down{transform:translateY(1px);box-shadow:0 1px 0 #050506,inset 0 1px 0 rgba(255,255,255,.05)}
.key.on{color:var(--accent);background:linear-gradient(180deg,var(--on1),var(--on2))}
.key.warn{color:var(--rec)}
.key.sm{height:30px;padding:0 8px;font-size:11.5px;border-radius:4px}
.key.xs{height:26px;min-width:26px;padding:0 7px;font-size:11px;border-radius:3px}
.key.ic{padding:0;width:34px}
.key svg,.tb svg{width:17px;height:17px;fill:currentColor;flex:none}
.key:disabled{opacity:.35}
.key .led{width:6px;height:6px;border-radius:50%;background:var(--led-off);flex:none}
.key.on .led{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.keys{display:inline-flex;gap:4px;flex:none}
.keys .key{min-width:30px;padding:0 7px}
.btn{height:36px;padding:0 12px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);
  font:600 13px var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 var(--accent-deep)}
.btn.warn{color:var(--rec)}
.btn.sm{height:32px;padding:0 9px;font-size:12px}
.btn.xs{height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4}

/* ---------- screens ---------- */
.scr{background:var(--bg);border:1px solid #000;border-radius:5px;box-shadow:inset 0 2px 10px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.lcdbox{height:30px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcdbox span{overflow:hidden;text-overflow:ellipsis}

/* ---------- transport ---------- */
#top{display:flex;align-items:center;gap:5px;flex:none;height:40px}
.tb{height:40px;padding:0 9px;border-radius:4px}
.tb.ic{padding:0;width:38px;min-width:38px}
#bPlay.on{color:var(--play)} #bPlay.on::after,#bRec.on::after,#bRec.armed::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
#bPlay.on::after{background:var(--play);box-shadow:0 0 6px var(--play)}
#bRec{color:var(--rec)} #bRec.armed::after{background:var(--rec);opacity:.6} #bRec.on::after{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.35}}
#bLoop{width:56px;flex-direction:column;gap:2px;line-height:1} #bLoop b{font:500 15px var(--font-ui);color:var(--ink)} #bLoop small{font-size:9px;color:var(--print);text-transform:uppercase;letter-spacing:.04em}
#bTempo{width:56px;flex-direction:column;gap:2px;line-height:1}
#bTempo.clk::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn:disabled{opacity:.32;pointer-events:none} .clipline b{color:var(--accent);font-weight:600} .lcdbox.edr{display:flex;align-items:center;justify-content:center;height:36px;font:500 12px var(--font-lcd);color:var(--accent)}
.grid.swapping .pad:not(.sel){animation:swapPulse 1s ease-in-out infinite alternate} @keyframes swapPulse{from{box-shadow:0 3px 0 #050506,inset 0 0 0 1px transparent}to{box-shadow:0 3px 0 #050506,inset 0 0 0 1px var(--accent-ring)}}
.synDev{flex:1 1 auto;min-height:0;padding:8px 8px 6px;gap:6px;border-radius:5px} .synDev::before,.synDev::after{display:none}
.synDev[data-eng="analog"]{border-left:9px solid #5b3418;border-right:9px solid #5b3418;border-image:linear-gradient(180deg,#7a4a26,#4a2a14 40%,#6b3f20 70%,#3e2310) 1;border-top:1px solid #000;border-bottom:1px solid #000}
.synDev .devHead{height:26px;padding:0 2px} .synDev .disp{background:var(--d-scr)} .synDev .synTabs .key{background:linear-gradient(180deg,#2a2826,#1d1c1a)} .synDev .synTabs .key.on{color:var(--d-ring)}
.synDev .knob .kb{stroke:#0a0908} .synDev .lcdbox.synInfo{background:var(--d-scr)}
#view.short .synDev .devHead{display:none} #view.short .synDev{padding:4px 5px 3px;gap:3px} #view.short .synTabs,#view.short .synTabs .key{height:26px}
#view.tiny .synDev .disp{min-height:22px} #view.short .kgrid.synGrid{grid-auto-rows:54px;gap:2px 4px} #view.short .synGrid .knob svg{width:34px;height:34px} #view.short .synGrid .selr{padding-top:2px} #view.short .synGrid .selr .sw{height:26px} #view.tiny .kgrid.synGrid{grid-auto-rows:48px} #view.tiny .soundView{gap:5px}
.mapRow .mchip{flex:0 1 auto;min-width:0;overflow:hidden;font-size:12px;padding:0 7px} .mapRow .madd{flex:none;padding:0 10px}
.mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapHint{flex:1;min-width:0;display:flex;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mchip b{font-weight:500;font-family:var(--font-lcd)} .madd{flex:none} .mapTip{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.srcbtn{display:flex;align-items:center;gap:7px;justify-content:center} .sdot{width:9px;height:9px;border-radius:50%;flex:none}
.synPages{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))} .synPages .key{width:100%;padding:0 2px;font-size:12px;white-space:nowrap} @media (max-width:400px){.synPages .key{font-size:10.5px;letter-spacing:-.02em}}
.synTabs{display:flex;gap:4px;height:30px;flex:none} .synTabs .key{flex:1;height:30px;padding:0 4px;font-size:12px;min-width:0} .synInfo{flex:1;display:flex;align-items:center;padding:0 10px;font:500 11.5px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcKey{flex:none;padding:0 8px} .mapKey{flex:none;padding:0 8px}
.mapBar{display:flex;flex-direction:column;gap:4px;flex:none} .mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapRow::-webkit-scrollbar{display:none}
.mapLab{flex:0 1 auto;min-width:60px;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap}
.mchip{flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap} .mchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.msrcs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0} .msrcs::-webkit-scrollbar{display:none} .mdone{margin-left:auto;flex:none}
.mapAmt{flex:1;min-width:0;height:34px} .mapAmt .prow{font-size:11px} .mapRow .key.mx{color:var(--rec)}
.knob .km{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.95}
.synGrid .modded .klab::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:1px}
.synGrid .maptgt{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .g4 .btn{padding:0 6px;min-width:0}
.btn.theme{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px} .btn.theme.on{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.swd{width:12px;height:12px;border-radius:50%;flex:none;background:var(--sa);box-shadow:0 0 0 2px var(--sb),0 0 6px var(--sa)}
/* pad styles: dark (default), tinted with the pad's colour, or fully coloured */
body[data-pads="tint"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 20%,#323237),color-mix(in srgb,var(--pc) 13%,#28282c) 60%,color-mix(in srgb,var(--pc) 10%,#242428))}
body[data-pads="bright"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 62%,#3a3a3f),color-mix(in srgb,var(--pc) 48%,#2a2a2e))} body[data-pads="bright"] .pad:not(.empty) .nm,body[data-pads="bright"] .pad:not(.empty) .pn{color:#111;text-shadow:0 1px 0 rgba(255,255,255,.2)}
body[data-pads="bright"] .pad:not(.empty)::after{background:color-mix(in srgb,var(--pc) 40%,#000)} body[data-pads="bright"] .pad.hit::after{background:#fff}
body[data-pads="tint"] .pad.hit,body[data-pads="bright"] .pad.hit{filter:brightness(1.3)}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px} .g6 .btn{padding-left:0;padding-right:0;min-width:0}
.btn.wide{width:100%}
.btn.prow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;text-align:left;width:100%;margin-bottom:6px;height:auto;min-height:50px;padding:8px 12px}
.btn.prow b{font-weight:600;font-size:15px} .btn.prow span{font-size:12px;color:var(--mute);justify-self:end} .btn.prow i{grid-column:1/-1;font-style:normal;font:400 12px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.prow.on span,.btn.prow.on i{color:inherit;opacity:.8}
#bTempo b{font:500 14px var(--font-lcd);color:var(--accent)}
#bTempo small{font-size:9px;color:var(--print)}
#bPanel.on{color:var(--accent)}
.spacer{flex:1}
#meter{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 60px 32px;gap:6px;align-items:center;height:12px;cursor:pointer}
#meter .bars{display:flex;flex-direction:column;gap:2px}
#meter .bar{height:3px;border-radius:2px;background:#0b0b0c;overflow:hidden}
#meter .bar i{display:block;height:100%;width:100%;transform:scaleX(0);background:var(--play);transform-origin:left}
#meter .bar i.hot{background:var(--accent)}
#meter .cpu{font-size:8.5px;color:var(--print);text-align:right;white-space:nowrap}
#meter .cpu.hot{color:var(--accent)}
#meter .clip{height:12px;border-radius:3px;background:#0b0b0c;border:1px solid #000;font:700 7px var(--font-lcd);color:var(--dim);display:flex;align-items:center;justify-content:center}
#meter .clip.on{background:var(--rec);color:#2b0707}

/* ---------- scene keys ---------- */
#scenes{display:flex;gap:6px;overflow-x:auto;flex:none;height:50px;scrollbar-width:none;padding-bottom:2px}
#scenes::-webkit-scrollbar{display:none}
.slot{flex:0 0 56px;height:47px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 6px;position:relative;overflow:hidden;text-align:left}
.slot .srow{display:flex;align-items:baseline;gap:4px;max-width:calc(100% - 8px);min-width:0;height:15px}
.slot .num{font:500 14px/14px var(--font-lcd);flex:none}
.slot .mini{display:block;width:44px;height:18px;border-radius:2px;margin-top:4px}
.slot.empty .mini{opacity:.5}
.slot .lbl{font-size:10.5px;min-width:0;font-weight:500;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;height:13px;line-height:13px}
.slot .meta{font:400 9.5px/10px var(--font-lcd);color:var(--dim);white-space:nowrap}
.slot .led{position:absolute;right:6px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
.slot.filled .led{background:var(--accent);box-shadow:0 0 5px var(--accent)}
.slot.empty .num{color:var(--dim)}
.slot.sel{background:linear-gradient(180deg,var(--on1),var(--on2))} .slot.sel .num{color:var(--accent)}
.slot.playing .led{background:var(--play);box-shadow:0 0 6px var(--play)}
.slot .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--play);width:0}

/* ---------- view & mode keys ---------- */
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#soundChip{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;height:42px}
#tabs button{height:40px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  font:600 13px var(--font-ui);color:var(--print);display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;white-space:nowrap;min-width:0}
#tabs button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
#tabs button.on{color:var(--ink)} #tabs button.on::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* ---------- knobs, selectors, faders ---------- */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:80px;gap:6px 4px;flex:none}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;min-width:0;padding:3px 2px;border-radius:4px;position:relative}
.knob svg{width:48px;height:48px;display:block}
.knob .kr{fill:none;stroke:#0b0b0c;stroke-width:4;stroke-dasharray:75 100;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--accent-glow))}
.knob .kb{fill:url(#knobFace);stroke:#060607;stroke-width:1}
.knob .ki{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.knob .kval{font:400 11px var(--font-lcd);color:var(--ink);white-space:nowrap;height:13px;line-height:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.knob .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;line-height:13px}
.knob.mini svg{width:30px;height:30px}.knob.mini .kval,.knob.mini .klab{display:none}
.nf{outline:2px solid var(--accent)!important;outline-offset:-2px}
.ne{outline:2px solid var(--play)!important;outline-offset:-2px;background-color:rgba(83,209,141,.08)}
.knob.nf,.knob.ne,.selr.nf,.selr.ne,.fader.nf,.fader.ne{border-radius:4px}
.knob.drag .kv{stroke:var(--accent-hi)}
.knob.autoed .klab{color:var(--accent)}
.knob.blank{visibility:hidden}
.selr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 2px;border-radius:8px;min-width:0;touch-action:none}
.selr .sw>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.2}
.selr .sw{height:34px;width:100%;max-width:72px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;
  font:400 11.5px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;margin-top:9px}
.selr .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;margin-top:2px}
.param{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px 10px;touch-action:pan-y;min-width:0}
.param .prow{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.param .plab{font-size:12.5px;font-weight:600;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.param .pval{font-size:11px;white-space:nowrap}
.param .ptrack{height:5px;border-radius:3px;background:#000;margin-top:9px;position:relative;overflow:hidden}
.param .pfill{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:3px}
.param.drag{border-color:var(--accent)}
.fader{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-height:0;width:100%;touch-action:none;border-radius:4px;padding:4px 3px 3px}
.fader .fval{font:400 9.5px var(--font-lcd);color:var(--ink);height:11px;line-height:11px;white-space:nowrap}
.fader .ftrack{flex:1;min-height:24px;width:100%;position:relative;display:flex;justify-content:center;gap:3px}
.fader .fmeter{width:5px;height:100%;border-radius:2px;background:#000;position:relative;overflow:hidden}

/* ---------- pads ---------- */

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 0;min-height:0;width:100%;max-height:calc(100cqw * 1.45);margin:auto 0}
.pad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;
  box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px 15px;position:relative;touch-action:none;min-width:0;min-height:0;overflow:hidden}

.pad.sel{border-color:#070708;box-shadow:0 3px 0 #050506,inset 0 0 0 1px var(--accent-ring)} .pad.sel .pn{color:var(--accent)}

.pad.hit::after{transition:none;background:var(--pc);box-shadow:0 0 8px var(--pc),0 0 2px #fff}
.pad.has .pn::after{content:"";display:inline-block;width:5px;height:5px;border-radius:1px;background:var(--pc);margin-left:5px;vertical-align:1px}
.pad.frz .nm::before{content:"❄ ";}
.pad.kp .nm{font:500 14px var(--font-lcd);text-transform:none}
.pad.kroot .pn{color:var(--accent)} .pad.kroot::after{background:color-mix(in srgb,var(--pc) 70%,#101012)}
.pad.kout .nm{color:var(--mute)} .pad.kout{background:linear-gradient(180deg,#2b2b2f,#232326)}
.pad.kchord .nm{font-size:13px;letter-spacing:-.01em}
.pad.klatch::after{background:var(--pc);box-shadow:0 0 8px var(--pc)} .pad.klatch .pn{color:var(--accent)} .pad.kprog .pn{color:var(--accent)}
.pad.kprog::before{content:"";position:absolute;inset:0;border-radius:2px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
/* ---------- timeline ---------- */
.seqView{height:100%;display:flex;flex-direction:column;gap:8px}
.lanebox{height:34px;flex:1 1 0;min-width:0;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8);display:flex;align-items:center;gap:6px;padding:0 8px;text-align:left}

/* ---------- sound ---------- */
.soundView,.fxView,.mixView{height:100%;display:flex;flex-direction:column;gap:8px;min-height:0}

#view.short .kgrid{grid-auto-rows:64px;gap:2px 4px}

.chopView{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}

.spads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:36px;gap:6px 5px;flex:none}
.spad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;color:var(--mute);font:400 12px var(--font-lcd);padding:0 0 7px;min-width:0;touch-action:none}
.spad::after{content:"";position:absolute;left:5px;right:5px;bottom:5px;height:3px;border-radius:1px;background:color-mix(in srgb,var(--pc) 45%,#101012);transition:background .25s,box-shadow .25s}
.spad.on{color:var(--accent);box-shadow:0 3px 0 #050506,inset 0 0 0 1px var(--accent-ring)}

.console.slideL{animation:slideL .14s ease-out}.console.slideR{animation:slideR .14s ease-out}

/* ---------- effects ---------- */
.slots{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;flex:none}

.devgrid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;line-height:1.1}

#view.short .dev{padding:10px 8px 6px;gap:6px} #view.short .dev .blurb{display:none} #view.short .dev .devHead{height:26px}
.fxHead{display:flex;gap:6px;align-items:center;flex:none;height:30px}

.strip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;min-height:0;overflow:hidden;border-radius:3px;padding:3px 1px;border:1px solid transparent}

/* ---------- lists in sheets ---------- */
.list{display:flex;flex-direction:column;gap:6px}

.spk.hit{transform:translateY(1px);background:linear-gradient(180deg,#3a3a40,#2e2e33)} .spk.hit::after{background:var(--pc);box-shadow:0 0 6px var(--pc)}

.pact{display:flex;gap:8px;align-items:center}

const WORKLET_SRC = "'use strict';\n/* Trackfill engine host.\n   Runs inside the AudioWorklet for live playback, and on the main thread for exports, bounces and freezes,\n   so every path produces identical audio. It owns a copy of the song plus sequencing, automation, routing\n   and solo logic. The WASM module (engine.cpp) does all per-sample work.\n\n   Timing: a lookahead cursor runs 20 ms ahead of the audio and pushes timestamped events into a heap.\n   That lets note-triggered duckers start before the note itself (true lookahead, no added latency). */\n\nconst TF = { PPQ: 96, BAR: 384, NCH: 83, NPAD: 64, G0: 64, B0: 72, R0: 80, MASTER: 82, NSLOT: 8, SUB: 16,\n  ARP_TAG: 1 << 24, FRZ_TAG: 1 << 20, PREVIEW_TAG: (1 << 20) - 1, CLICK_TAG: (1 << 20) - 2 };\n\n/* ---------- synth parameters: the single list the engine (generated header), host and UI all use ----------\n   [id, label, kind, a, b, default, tab]   kinds: lin a..b \u00b7 exp a..b \u00b7 int a..b \u00b7 opt (a = labels) \u00b7 bip -1..1 scaled to a..b \u00b7 db (a..b dB, engine gets gain)\n   Patches store physical values by id; the engine works on 0..1 per parameter so modulation is uniform. */\nconst TF_WAVES = ['Sine', 'Triangle', 'Saw', 'Square', 'Pulse'];\nconst TF_LFO_DIVS = [['4 bars', 16], ['2 bars', 8], ['1 bar', 4], ['1/2', 2], ['1/2 D', 3], ['1/2 T', 4 / 3], ['1/4', 1], ['1/4 D', 1.5], ['1/4 T', 2 / 3], ['1/8', .5], ['1/8 D', .75], ['1/8 T', 1 / 3], ['1/16', .25], ['1/16 T', 1 / 6], ['1/32', .125]];\nconst TFSYN = (() => {\n  const L = [], osc = (n, def) => { const o = 'o' + n;\n    L.push([o + 'w', 'Wave', 'opt', TF_WAVES, 0, def.w, o], [o + 'o', 'Octave', 'int', -2, 2, def.o || 0, o], [o + 's', 'Semi', 'lin', -12, 12, def.s || 0, o], [o + 'f', 'Fine', 'lin', -100, 100, def.f || 0, o],\n      [o + 'l', 'Level', 'lin', 0, 1, def.l, o], [o + 'p', 'Width', 'lin', .05, .95, .5, o]); };\n  osc(1, { w: 'Saw', l: .8 }); osc(2, { w: 'Saw', l: 0, f: 7 }); L.push(['o2y', 'Sync', 'opt', ['Off', 'On'], 0, 'Off', 'o2'], ['o2m', 'FM', 'lin', 0, 1, 0, 'o2']);\n  osc(3, { w: 'Square', l: 0, o: -1 }); L.push(['o3x', 'Mode', 'opt', ['Audio', 'LFO'], 0, 'Audio', 'o3'], ['o3r', 'LFO rate', 'exp', .05, 20, 2, 'o3']);\n  L.push(['dri', 'Drift', 'lin', 0, 1, .15, 'vo'], ['ret', 'Retrig', 'opt', ['Off', 'On'], 0, 'On', 'vo'], ['fbk', 'Feedback', 'lin', 0, 1, 0, 'vo'], ['uni', 'Unison', 'int', 1, 7, 1, 'vo'],\n    ['det', 'Detune', 'lin', 0, 1, .25, 'vo'], ['spr', 'Spread', 'lin', 0, 1, .6, 'vo'], ['vel', 'Velocity', 'lin', 0, 1, .5, 'vo'], ['pit', 'Pitch', 'lin', -24, 24, 0, 'vo'], ['gan', 'Level', 'db', -24, 6, 0, 'vo']);\n  L.push(['sbl', 'Sub', 'lin', 0, 1, 0, 'sb'], ['sbo', 'Octave', 'opt', ['\u22121 oct', '\u22122 oct'], 0, '\u22121 oct', 'sb'], ['sbw', 'Wave', 'opt', ['Sine', 'Triangle', 'Square'], 0, 'Sine', 'sb'],\n    ['spl', 'Split', 'lin', 0, 1, 0, 'sb'], ['spn', 'Split below', 'int', 24, 96, 96, 'sb']);\n  L.push(['nzn', 'Noise', 'lin', 0, 1, .7, 'nz'], ['nzt', 'Tone', 'lin', 0, 1, .6, 'nz'], ['nzb', 'Body', 'lin', 0, 1, .5, 'nz'], ['nzd', 'Drive', 'lin', 0, 1, .4, 'nz'],\n    ['nzh', 'High-pass', 'exp', 100, 12000, 1500, 'nz'], ['nzl', 'Level', 'lin', 0, 1, 0, 'nz'], ['nzo', 'Body oct', 'opt', ['0', '\u22121 oct', '\u22122 oct'], 0, '\u22121 oct', 'nz'], ['nzk', 'Track', 'opt', ['Off', 'On'], 0, 'Off', 'nz']);\n  L.push(['flt', 'Filter', 'opt', ['Off', 'Clean', 'Ladder', 'Diode', 'Screamer', 'Formant', 'Comb'], 0, 'Ladder', 'fl'], ['cut', 'Cutoff', 'exp', 20, 20000, 6000, 'fl'], ['res', 'Resonance', 'lin', 0, 1, .15, 'fl'],\n    ['drv', 'Drive', 'lin', 0, 1, 0, 'fl'], ['fen', 'Env 2', 'bip', -1, 1, 0, 'fl'], ['key', 'Key track', 'lin', 0, 1, .3, 'fl'], ['shp', 'Shape', 'lin', 0, 1, 0, 'fl']);\n  for (const [e, n, dA, dD, dS, dR] of [['a', 'Amp', .002, .4, 1, .25], ['2', 'Env 2', .002, .35, 0, .3], ['3', 'Env 3', .002, .5, 0, .5]])\n    L.push([e + 'a', 'Attack', 'exp', .0005, 10, dA, 'e' + e], [e + 'd', 'Decay', 'exp', .005, 10, dD, 'e' + e], [e + 's', 'Sustain', 'lin', 0, 1, dS, 'e' + e], [e + 'r', 'Release', 'exp', .005, 15, dR, 'e' + e],\n      [e + 'c', 'Att curve', 'bip', -1, 1, 0, 'e' + e], [e + 'k', 'Curve', 'bip', -1, 1, -.5, 'e' + e]);\n  for (let k = 1; k <= 4; k++) L.push(['l' + k + 'y', 'Sync', 'opt', ['Free', 'Sync'], 0, 'Sync', 'l' + k], ['l' + k + 'r', 'Rate', 'exp', .02, 40, 2, 'l' + k],\n    ['l' + k + 'd', 'Rate', 'opt', TF_LFO_DIVS.map(d => d[0]), 0, '1/4', 'l' + k], ['l' + k + 'm', 'Mode', 'opt', ['Retrig', 'Free', 'One-shot'], 0, 'Retrig', 'l' + k],\n    ['l' + k + 'o', 'Smooth', 'lin', 0, 1, 0, 'l' + k], ['l' + k + 'p', 'Phase', 'lin', 0, 1, 0, 'l' + k]);\n  for (let k = 1; k <= 4; k++) L.push(['m' + k, 'Macro ' + k, 'lin', 0, 1, 0, 'mc']);\n  return L.map(([id, l, k, a, b, d, tab], i) => ({ i, id, l, k, a, b, d, tab }));\n})();\nconst TFSYN_ID = Object.fromEntries(TFSYN.map(p => [p.id, p]));\n// modulation sources, in engine order\nconst TF_SRC = ['Amp env', 'Env 2', 'Env 3', 'LFO 1', 'LFO 2', 'LFO 3', 'LFO 4', 'Velocity', 'Note', 'Random', 'Alternate', 'Osc 3', 'Macro 1', 'Macro 2', 'Macro 3', 'Macro 4'];\nfunction tfSynNorm(p, v) {\n  if (v == null) v = p.d;\n  switch (p.k) {\n    case 'opt': { const i = typeof v === 'number' ? v : p.a.indexOf(v); return p.a.length > 1 ? Math.max(0, i) / (p.a.length - 1) : 0; }\n    case 'exp': return Math.max(0, Math.min(1, Math.log(Math.max(p.a, Math.min(p.b, v)) / p.a) / Math.log(p.b / p.a)));\n    default: return Math.max(0, Math.min(1, (v - p.a) / (p.b - p.a)));\n  }\n}\nfunction tfSynPhys(p, n) {\n  n = Math.max(0, Math.min(1, n));\n  switch (p.k) {\n    case 'opt': return p.a[Math.round(n * (p.a.length - 1))];\n    case 'int': return Math.round(p.a + (p.b - p.a) * n);\n    case 'exp': return p.a * Math.pow(p.b / p.a, n);\n    default: return p.a + (p.b - p.a) * n;\n  }\n}\n// a drawn LFO shape: points {x, y, c} (x, y in 0..1, c = curve to the next point) \u2192 256 values in -1..1\nfunction tfLfoTable(pts) {\n  const out = new Float32Array(256), P = (pts && p /* ---------- analyzer & meters ----------

const IC_SCOPE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20V14h3v6zm5 0V8h3v12zm5 0v-9h3v9zm5 0V5h3v15z"/></svg>';

   only for the effect on screen. Colours come from the device's screen (each mode has its own look). */

/* ---------- Edit: one clipboard for pads, scenes, timeline bars, effect devices and channel strips ----------
   The Edit key (top bar, or Shift + OK on the d-pad) opens a sheet for whatever you're on, plus the current scene. */
let CLIP = null;   // { kind: 'pad' | 'scene' | 'bars' | 'fx' | 'chain' | 'chan', label, data }
const clone = o => JSON.parse(JSON.stringify(o));
function setClip(kind, label, data) { CLIP = { kind, label, data: clone(data) }; toast('Copied: ' + label); }
const clipIs = k => CLIP && CLIP.kind === k;

/* ----- pads ----- */
function copyPad(pi) { setClip('pad', `${padLabel(pi)} · ${P.pads[pi].name || 'Empty'}`, { pad: P.pads[pi], chan: P.chans[pi] }); }
function putPad(pi, src) {
  if (P.pads[pi].frz) unfreeze(pi);
  const pad = Object.assign(defaultPad(pi), clone(src.pad), { frz: null }), chan = clone(src.chan);
  P.pads[pi] = pad; P.chans[pi] = Object.assign(defaultChan(pi), chan);
  syncPad(pi); syncChan(pi); P.scenes.forEach((_, i) => syncScene(i)); markDirty();
}
function pastePad(pi) { if (!clipIs('pad')) return; pushUndo('all'); putPad(pi, CLIP.data); renderAll(); toast(`Pasted onto ${padLabel(pi)}`); }
function duplicatePad(pi) {
  let to = -1; for (let k = 1; k < NPADS; k++) { const j = (pi + k) % NPADS; if (!hasSound(P.pads[j]) && !Object.values(P.scenes).some(s => s.notes[j] && s.notes[j].length)) { to = j; break; } }
  if (to < 0) { toast('No empty pad left to duplicate into'); return; }
  pushUndo('all'); putPad(to, { pad: P.pads[pi], chan: P.chans[pi] }); P.pads[to].name = (P.pads[pi].name || 'Sound').slice(0, 10) + ' 2';
  UI.pad = to; UI.bank = Math.floor(to / 16); renderAll(); toast(`Duplicated to ${padLabel(to)}`);
}
// swap two pads everywhere: sounds, channel strips, notes in every scene, automation and ducker triggers
function swapPads(a, b) {
  if (a === b) return; pushUndo('all');
  [P.pads[a], P.pads[b]] = [P.pads[b], P.pads[a]]; [P.chans[a], P.chans[b]] = [P.chans[b], P.chans[a]];
  const m = x => x === a ? b : x === b ? a : x;
  for (const sc of P.scenes) {
    const na = sc.notes[a], nb = sc.notes[b]; delete sc.notes[a]; delete sc.notes[b]; if (na) sc.notes[b] = na; if (nb) sc.notes[a] = nb;
    const A = {}; for (const k in sc.auto) { const p = k.split('.'); p[0] = String(m(+p[0])); A[p.join('.')] = sc.auto[k]; } sc.auto = A; }
  for (const C of P.chans) for (const f of C.fx || []) if (f.trig) f.trig = f.trig.map(m);
  syncProject(); markDirty(); renderAll(); toast(`Swapped ${padLabel(a)} and ${padLabel(b)}`);
}
function clearPad(pi) { pushUndo('all'); if (P.pads[pi].frz) unfreeze(pi); P.pads[pi] = defaultPad(pi); P.chans[pi] = defaultChan(pi); syncPad(pi); syncChan(pi); markDirty(); renderAll(); toast(`${padLabel(pi)} cleared (its notes are kept)`); }

/* ----- scenes ----- */
function copyScene(i) { setClip('scene', `Scene ${i + 1}${P.scenes[i].name ? ' · ' + P.scenes[i].name : ''}`, P.scenes[i]); }
function pasteScene(i) { if (!clipIs('scene')) return; pushUndo('scene:' + i); P.scenes[i] = clone(CLIP.data); syncScene(i); markDirty(); renderAll(); toast(`Pasted into scene ${i + 1}`); }
// scenes move: frozen clips (stored per scene) move with them
function remapScenes(map) { for (const p of P.pads) if (p.frz) { const f = {}; for (const k in p.frz) { const t = map(+k); if (t != null) f[t] = p.frz[k]; } p.frz = f; } }
function duplicateScene(i) {
  const last = NSCENES - 1; if (i >= last) { toast('The last scene has no room after it'); return; }
  if (noteCount(P.scenes[last])) { toast(`Scene ${NSCENES} isn't empty, so there's no room to insert. Clear it first.`); return; }
  pushUndo('all'); P.scenes.splice(i + 1, 0, clone(P.scenes[i])); P.scenes.length = NSCENES; remapScenes(k => k > i ? (k + 1 <= last ? k + 1 : null) : k);
  syncProject(); markDirty(); selectScene(i + 1); renderAll(); toast(`Duplicated into scene ${i + 2}; later scenes moved along`);
}
function moveScene(i, d) {
  const j = i + d; if (j < 0 || j >= NSCENES) return; pushUndo('all'); [P.scenes[i], P.scenes[j]] = [P.scenes[j], P.scenes[i]]; remapScenes(k => k === i ? j : k === j ? i : k);
  syncProject(); markDirty(); selectScene(j); renderAll();
}
function clearScene(i) { pushUndo('scene:' + i); P.scenes[i] = Object.assign(emptyScene(), { bars: P.scenes[i].bars }); syncScene(i); markDirty(); renderAll(); toast(`Scene ${i + 1} cleared`); }

/* ----- timeline bars: notes (bank view: the bank's 16 pads; keys view: this pad) and automation ----- */
const EDR = { from: 0, len: 1 };   // bars, remembered while the sheet is open
function barsScope() {
  const tl = UI.tl; if (tl.lane !== 'notes') return { pads: [], keys: [tl.lane], desc: keyMeta(tl.lane).label };
  const pads = tl.mode === 'bank' ? Array.from({ length: 16 }, (_, k) => UI.bank * 16 + k) : [UI.pad];
  const keys = new Set(); for (const sc of [P.scenes[UI.scene]]) for (const k in sc.auto) if (pads.includes(+k.split('.')[0])) keys.add(k);
  return { pads, keys: [...keys], desc: tl.mode === 'bank' ? 'Bank ' + BANKS[UI.bank] : padLabel(UI.pad) + ' ' + (P.pads[UI.pad].name || '') };
}
function grabBars(si, t0, t1, sc0) {
  const sc = P.scenes[si], d = { len: t1 - t0, notes: {}, auto: {}, single: sc0.pads.length === 1 && UI.tl.lane === 'notes' };
  for (const pi of sc0.pads) { const a = (sc.notes[pi] || []).filter(n => n.t >= t0 - 1e-6 && n.t < t1 - 1e-6).map(n => Object.assign({}, n, { t: fixT(n.t - t0) })); if (a.length) d.notes[pi] = a; }
  for (const k of sc0.keys) { const a = (sc.auto[k] || []).filter(p => p.t >= t0 && p.t < t1).map(p => Object.assign({}, p, { t: p.t - t0 })); if (a.length) d.auto[k] = a; }
  return d;
}
function putBars(si, at, d, targetPad) {
  const sc = P.scenes[si], end = at + d.len, L = sc.bars * BAR;
  const map = pi => d.single && targetPad != null ? targetPad : pi;
  for (const pi in d.notes) { const t = map(+pi); touchPad(t); const keep = (sc.notes[t] || []).filter(n => n.t < at - 1e-6 || n.t >= end - 1e-6);
    sc.notes[t] = keep.concat(d.notes[pi].filter(n => at + n.t < L).map(n => Object.assign({}, n, { t: fixT(at + n.t) }))).sort((x, y) => x.t - y.t); }
  for (const k in d.auto) { const p = k.split('.'), nk = d.single && targetPad != null ? [targetPad].concat(p.slice(1)).join('.') : k;
    const keep = (sc.auto[nk] || []).filter(q => q.t < at || q.t >= end); sc.auto[nk] = keep.concat(d.auto[k].filter(q => at + q.t < L).map(q => Object.assign({}, q, { t: at + q.t }))).sort((x, y) => x.t - y.t); }
  syncScene(si); markDirty();
}
function copyBars() { const s = barsScope(), t0 = EDR.from * BAR, t1 = Math.min(sceneLen(UI.scene), t0 + EDR.len * BAR);
  setClip('bars', `${EDR.len} bar${EDR.len > 1 ? 's' : ''} · ${s.desc}`, grabBars(UI.scene, t0, t1, s)); }

/* ----- value formatting ----- */
function hzStr(v) { return v >= 1000 ? (v / 1000).toFixed(v >= 10000 ? 1 : 2) + ' kHz' : v >= 10 ? Math.round(v) + ' Hz' : v.toFixed(2) + ' Hz'; }

function synFmt(p, v) {
  if (p.k === 'opt') return v;
  const id = p.id, pct = x => Math.round(x * 100) + '%', sg = x => (x > 0 ? '+' : '') + x;
  if (/^o\do$/.test(id)) return sg(v) + ' oct';
  if (/^o\ds$/.test(id)) return sg(Math.round(v)) + ' st';
  if (/^o\df$/.test(id)) return sg(Math.round(v)) + ' ct';
  if (id === 'o3r' || /^l\dr$/.test(id) || id === 'cut' || id === 'nzh') return hzStr(v);
  if (/^[a23][adr]$/.test(id)) return secStr(v);
  if (/^[a23][ck]$/.test(id)) return sg(+v.toFixed(2));

}

/* ================= meter, transport wiring & frame loop ================= */
const METER = { l: 0, r: 0, clip: false };
const meterEls = [...document.querySelectorAll('#meter .bar i')], clipEl = document.querySelector('#meter .clip'), cpuEl = document.querySelector('#meter .cpu');
let lastCpuDraw = 0;
const meterLast = [-1, -1];
function drawMeter() { [METER.l, METER.r].forEach((v, i) => { const db = v > 1e-5 ? 20 * Math.log10(v) : -99, f = Math.round(clamp((db + 48) / 48, 0, 1) * 200) / 200; if (f === meterLast[i]) return; meterLast[i] = f;   // write the style only when it changes
    meterEls[i].style.transform = `scaleX(${f})`; meterEls[i].classList.toggle('hot', db > -3); }); clipEl.classList.toggle('on', METER.clip);
  const n = performance.now(); if (n - lastCpuDraw > 400) { lastCpuDraw = n; const c = ENG.ready ? Math.round(REP.cpu * 100) : null; cpuEl.textContent = c == null ? 'CPU —' : `CPU ${c}%`; cpuEl.classList.toggle('hot', c != null && c > 60); } }

new ResizeObserver(() => { const V = $('#view'), hh = V.clientHeight; V.classList.toggle('short', hh < 470); V.classList.toggle('tiny', hh < 360); if (UI.view === 'seq') sizeTL(); else if (UI.view === 'sound') { drawDisp(); drawSynDisp(); } else if (UI.view === 'mix') UI.regs.forEach(f => f.upd && f.upd()); if (UI.panel) updatePanel(); }).observe($('#view'));
let lastHeard = -1;
// the screen loop runs only while something moves (playback, sound, meters falling, a recent touch); wake() restarts it
let frameOn = false, lastFrame = 0, wakeAt = 0;
function wake() { wakeAt = performance.now(); if (!frameOn) { frameOn = true; requestAnimationFrame(frame); } }
function frame(ts) {
  if (!P) { requestAnimationFrame(frame); return; }
  if (ts - lastFrame < 14) { requestAnimationFrame(frame); return; } lastFrame = ts;   // ~60 fps is plenty for meters and playheads, even on a 120 Hz screen
  METER.l *= .97; METER.r *= .97; drawMeter();
  const scoping = scopeMoving(); if (scoping) scopeFrame(Math.min(.1, (ts - (frame.prev || ts)) / 1000)); frame.prev = ts;
  const busy = scoping || T.playing || METER.l > 1e-4 || METER.r > 1e-4 || REP.voices > 0 || performance.now() - wakeAt < 1500 || (UI.view === 'mix' && STRIP_METERS.some(m => m.v > 1e-4));

  if (!ctx) return;
  if (UI.view === 'mix') for (const m of STRIP_METERS) { const pk = REP.cm[m.c] || 0; m.v = Math.max(pk, m.v * .9); const db = m.v > 1e-5 ? 20 * Math.log10(m.v) : -99, f = clamp((db + 48) / 54, 0, 1);
    m.el.style.height = (f * 100).toFixed(1) + '%'; m.el.style.background = db > 0 ? COL.rec : db > -6 ? COL.accent : COL.play; }
  const pos = heardPos();
  if (pos) {
    if (pos.scene !== lastHeard) { lastHeard = pos.scene; if (pos.scene !== UI.scene && !TL.drag) { UI.scene = pos.scene; UI.tl.sel = null; UI.tl.selPt = -1; UI.tl.sx = 0; renderScenes(); if (UI.view === 'pads') refreshPadDots(); else if (UI.view === 'seq') renderView(); } }
    updatePlayingSlot(pos);
    if (UI.view === 'seq' && pos.scene === UI.scene && !TL.drag) { const x = t2x(pos.tick); if (x > TL.W - 4 || x < LABEL_W) UI.tl.sx = Math.floor(pos.tick / BAR) * BAR; }
    if (UI.view === 'seq') drawTL();
  } else if (lastHeard !== -1) { lastHeard = -1; updatePlayingSlot(null); }
}
