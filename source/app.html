<title>Trackfill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Trackfill hardware: a matte charcoal body with rubber keys, backlit pads and knobs; data lives in recessed screens.
   Layout is fixed like a device: every region has a set size, nothing wraps, text truncates, numbers use fixed-width digits. */
:root{
  color-scheme: dark;
  /* body & controls */
  --body:#1c1c1f; --body2:#242428; --keyhi:#3b3b41; --keylo:#2a2a2f; --edge:#09090a; --print:#a29d93; --led-off:#3a2f2b;
  /* screen (also used by canvas drawing) */
  --bg:#0a0a0b; --panel:#111113; --raised:#19191c; --raised2:#222226; --line:#2c2b30; --ink:#ece8e0; --mute:#9b968d; --dim:#56534e; --sheet:#141416; --glow:#26262b;
  /* signal colors */
  --accent:#f2b544; --accent-ink:#241803;
  /* shades of the accent, so a theme only needs to set --accent and --accent-ink */
  --accent-hi:color-mix(in srgb,var(--accent) 62%,#fff); --accent-lo:color-mix(in srgb,var(--accent) 72%,#000); --accent-deep:color-mix(in srgb,var(--accent) 34%,#000);
  --accent-ring:color-mix(in srgb,var(--accent) 52%,#111); --accent-glow:color-mix(in srgb,var(--accent) 55%,transparent);
  --on1:color-mix(in srgb,var(--accent) 22%,#38362f); --on2:color-mix(in srgb,var(--accent) 16%,#2a2722); --rec:#e5483d; --play:#53d18d; --play-ink:#0a1a11;
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lcd:"Figtree", system-ui, sans-serif;   /* values: same family as the UI, lighter weight, fixed-width digits */
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overscroll-behavior:none;background:var(--body) radial-gradient(140% 70% at 50% 0%,var(--glow) 0%,var(--body) 60%);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea{font:inherit;color:var(--ink)}
.lcd{font-family:var(--font-lcd);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(8px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}

/* ---------- rubber keys ---------- */
.key,.tb{height:34px;min-width:34px;padding:0 10px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);
  box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);color:var(--ink);font:600 13px/1 var(--font-ui);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;position:relative;overflow:hidden;text-overflow:ellipsis}
.key:active,.tb:active,.key.down{transform:translateY(1px);box-shadow:0 1px 0 #050506,inset 0 1px 0 rgba(255,255,255,.05)}
.key.on{color:var(--accent);background:linear-gradient(180deg,var(--on1),var(--on2))}
.key.warn{color:var(--rec)}
.key.sm{height:30px;padding:0 8px;font-size:11.5px;border-radius:4px}
.key.xs{height:26px;min-width:26px;padding:0 7px;font-size:11px;border-radius:3px}
.key.ic{padding:0;width:34px}
.key svg,.tb svg{width:17px;height:17px;fill:currentColor;flex:none}
.key:disabled{opacity:.35}
.key .led{width:6px;height:6px;border-radius:50%;background:var(--led-off);flex:none}
.key.on .led{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.keys{display:inline-flex;gap:4px;flex:none}
.keys .key{min-width:30px;padding:0 7px}
.btn{height:36px;padding:0 12px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);
  font:600 13px var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 var(--accent-deep)}
.btn.warn{color:var(--rec)}
.btn.sm{height:32px;padding:0 9px;font-size:12px}
.btn.xs{height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4}

/* ---------- screens ---------- */
.scr{background:var(--bg);border:1px solid #000;border-radius:5px;box-shadow:inset 0 2px 10px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}
.lcdbox{height:30px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05);
  display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcdbox span{overflow:hidden;text-overflow:ellipsis}

/* ---------- transport ---------- */
#top{display:flex;align-items:center;gap:5px;flex:none;height:40px}
.tb{height:40px;padding:0 9px;border-radius:4px}
.tb.ic{padding:0;width:38px;min-width:38px}
#bPlay.on{color:var(--play)} #bPlay.on::after,#bRec.on::after,#bRec.armed::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
#bPlay.on::after{background:var(--play);box-shadow:0 0 6px var(--play)}
#bRec{color:var(--rec)} #bRec.armed::after{background:var(--rec);opacity:.6} #bRec.on::after{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.35}}
#bLoop{width:56px;flex-direction:column;gap:2px;line-height:1} #bLoop b{font:500 15px var(--font-ui);color:var(--ink)} #bLoop small{font-size:9px;color:var(--print);text-transform:uppercase;letter-spacing:.04em}
#bTempo{width:56px;flex-direction:column;gap:2px;line-height:1}
#bTempo.clk::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn:disabled{opacity:.32;pointer-events:none} .clipline b{color:var(--accent);font-weight:600} .lcdbox.edr{display:flex;align-items:center;justify-content:center;height:36px;font:500 12px var(--font-lcd);color:var(--accent)}
.grid.swapping .pad:not(.sel){animation:swapPulse 1s ease-in-out infinite alternate} @keyframes swapPulse{from{box-shadow:0 3px 0 #050506,inset 0 0 0 1px transparent}to{box-shadow:0 3px 0 #050506,inset 0 0 0 1px var(--accent-ring)}}
.synDev .devHead{gap:5px;padding:0} .engKey{flex:none;height:28px;padding:0 4px 0 2px;background:none;border:0;display:flex;align-items:baseline;gap:4px;color:var(--d-ink)}
.engKey b{font:800 15px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase} .engKey .car{font-size:9px;opacity:.7}
.presetLcd{flex:1;min-width:0;height:28px;border-radius:3px;background:var(--d-scr);border:1px solid #000;box-shadow:inset 0 1px 5px rgba(0,0,0,.8);display:flex;align-items:center;gap:8px;padding:0 9px;text-align:left}
.presetLcd span{flex:1;min-width:0;font:500 14px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .presetLcd i{font:500 10px var(--font-lcd);font-style:normal;color:var(--mute);flex:none}
.synDev .pstep{flex:none;width:28px;min-width:28px;height:28px;padding:0}
.saveRow{display:flex;gap:6px;align-items:center} .saveRow .textin{flex:1} .saveRow .btn{flex:none;height:34px}
.lsub{margin-left:auto;font:400 12px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%} .lsub.warn{color:var(--rec)}
/* drum faceplate: same frame as the synths, with the More like this / slots row in the tabs' place */
.drumRow{display:grid!important;grid-template-columns:2.2fr repeat(4,1fr)} .drumRow .key{width:100%;padding:0 4px} .drumRow .likeKey{color:var(--d-ring)} .drumRow .slotKey.empty{opacity:.35} .drumDev .knob.locked .klab::after{content:' 🔒';font-size:9px}
.dev.synDev{flex:1 1 auto;min-height:0;padding:8px 8px 6px;gap:6px;border-radius:5px} .synDev::before,.synDev::after{display:none}
.synDev[data-eng="analog"]{border-left:9px solid #5b3418;border-right:9px solid #5b3418;border-image:linear-gradient(180deg,#7a4a26,#4a2a14 40%,#6b3f20 70%,#3e2310) 1;border-top:1px solid #000;border-bottom:1px solid #000}
.synDev .devHead{height:26px;padding:0 2px} .synDev .disp{background:var(--d-scr)} .synDev .synTabs .key{background:linear-gradient(180deg,#2a2826,#1d1c1a)} .synDev .synTabs .key.on{color:var(--d-ring)}
.synDev .knob .kb{stroke:#0a0908} .synDev .lcdbox.synInfo{background:var(--d-scr)}
#view.short .synDev .devHead{display:none} #view.short .synDev{padding:4px 5px 3px;gap:3px} #view.short .synTabs,#view.short .synTabs .key{height:26px}
#view.tiny .synDev .disp{min-height:0} .synDev .disp.gone canvas{visibility:hidden} #view.short .kgrid.synGrid{grid-auto-rows:54px;gap:2px 4px} #view.short .synGrid .knob svg{width:34px;height:34px} #view.short .synGrid .selr{padding-top:2px} #view.short .synGrid .selr .sw{height:26px} #view.tiny .soundView{gap:5px}
.mapRow .mchip{flex:0 1 auto;min-width:0;overflow:hidden;font-size:12px;padding:0 7px} .mapRow .madd{flex:none;padding:0 10px}
.mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapHint{flex:1;min-width:0;display:flex;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mchip b{font-weight:500;font-family:var(--font-lcd)} .madd{flex:none} .mapTip{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.srcbtn{display:flex;align-items:center;gap:7px;justify-content:center} .sdot{width:9px;height:9px;border-radius:50%;flex:none}
.synPages{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))} .synPages .key{width:100%;padding:0 2px;font-size:12px;white-space:nowrap} @media (max-width:400px){.synPages .key{font-size:10.5px;letter-spacing:-.02em}}
.synTabs{display:flex;gap:4px;height:30px;flex:none} .synTabs .key{flex:1;height:30px;padding:0 4px;font-size:12px;min-width:0} .synInfo{flex:1;display:flex;align-items:center;padding:0 10px;font:500 11.5px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcKey{flex:none;padding:0 8px} .mapKey{flex:none;padding:0 8px}
/* Map's rows take exactly the space of what they replace (page keys, the faceplate's preset line), so nothing moves */
.mapAmt.param{padding:4px 9px 0;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden} .mapAmt.param .ptrack{margin-top:0;height:4px} .soundView>.mapRow{height:30px} .synDev>.mapRow{height:28px} .mapRow>.key,.mapRow>.lcdbox,.mapRow .mapAmt{height:100%;min-height:0} .synDev>.mapRow .key{font-size:11.5px}
.mapBar{display:flex;flex-direction:column;gap:4px;flex:none} .mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapRow::-webkit-scrollbar{display:none}
.mapLab{flex:0 1 auto;min-width:60px;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap}
.mchip{flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap} .mchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.msrcs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0} .msrcs::-webkit-scrollbar{display:none} .mdone{margin-left:auto;flex:none}
.mapAmt{flex:1;min-width:0;height:100%} .mapAmt .prow{font-size:11px} .mapRow .key.mx{color:var(--rec)}
.knob .km{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.95}
.synGrid .modded .klab::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:1px}
.synGrid .maptgt{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .g4 .btn{padding:0 6px;min-width:0}
.btn.theme{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px} .btn.theme.on{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.swd{width:12px;height:12px;border-radius:50%;flex:none;background:var(--sa);box-shadow:0 0 0 2px var(--sb),0 0 6px var(--sa)}
/* pad styles: dark (default), tinted with the pad's colour, or fully coloured */
body[data-pads="tint"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 20%,#323237),color-mix(in srgb,var(--pc) 13%,#28282c) 60%,color-mix(in srgb,var(--pc) 10%,#242428))}
body[data-pads="bright"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 62%,#3a3a3f),color-mix(in srgb,var(--pc) 48%,#2a2a2e))} body[data-pads="bright"] .pad:not(.empty) .nm,body[data-pads="bright"] .pad:not(.empty) .pn{color:#111;text-shadow:0 1px 0 rgba(255,255,255,.2)}
body[data-pads="bright"] .pad:not(.empty)::after{background:color-mix(in srgb,var(--pc) 40%,#000)} body[data-pads="bright"] .pad.hit::after{background:#fff}
body[data-pads="tint"] .pad.hit,body[data-pads="bright"] .pad.hit{filter:brightness(1.3)}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px} .g6 .btn{padding-left:0;padding-right:0;min-width:0}
.btn.wide{width:100%}
.btn.prow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;text-align:left;width:100%;margin-bottom:6px;height:auto;min-height:50px;padding:8px 12px}
.btn.prow b{font-weight:600;font-size:15px} .btn.prow span{font-size:12px;color:var(--mute);justify-self:end} .btn.prow i{grid-column:1/-1;font-style:normal;font:400 12px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.prow.on span,.btn.prow.on i{color:inherit;opacity:.8}
#bTempo b{font:500 14px var(--font-lcd);color:var(--accent)}
#bTempo small{font-size:9px;color:var(--print)}
#bPanel.on{color:var(--accent)}
.spacer{flex:1}
#meter{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 60px 32px;gap:6px;align-items:center;height:12px;cursor:pointer}
#meter .bars{display:flex;flex-direction:column;gap:2px}
#meter .bar{height:3px;border-radius:2px;background:#0b0b0c;overflow:hidden}
#meter .bar i{display:block;height:100%;width:100%;transform:scaleX(0);background:var(--play);transform-origin:left}
#meter .bar i.hot{background:var(--accent)}
#meter .cpu{font-size:8.5px;color:var(--print);text-align:right;white-space:nowrap}
#meter .cpu.hot{color:var(--accent)} #meter .cpu.busy::after{content:' ·';color:var(--accent)}
#meter .clip{height:12px;border-radius:3px;background:#0b0b0c;border:1px solid #000;font:700 7px var(--font-lcd);color:var(--dim);display:flex;align-items:center;justify-content:center}
#meter .clip.on{background:var(--rec);color:#2b0707}

/* ---------- scene keys ---------- */
#scenes{display:flex;gap:6px;overflow-x:auto;flex:none;height:50px;scrollbar-width:none;padding-bottom:2px}
#scenes::-webkit-scrollbar{display:none}
.slot{flex:0 0 56px;height:47px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 6px;position:relative;overflow:hidden;text-align:left}
.slot .srow{display:flex;align-items:baseline;gap:4px;max-width:calc(100% - 8px);min-width:0;height:15px}
.slot .num{font:500 14px/14px var(--font-lcd);flex:none}
.slot .mini{display:block;width:44px;height:18px;border-radius:2px;margin-top:4px}
.slot.empty .mini{opacity:.5}
.slot .lbl{font-size:10.5px;min-width:0;font-weight:500;color:var(--print);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;height:13px;line-height:13px}
.slot .meta{font:400 9.5px/10px var(--font-lcd);color:var(--dim);white-space:nowrap}
.slot .led{position:absolute;right:6px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
.slot.filled .led{background:var(--accent);box-shadow:0 0 5px var(--accent)}
.slot.empty .num{color:var(--dim)}
.slot.sel{background:linear-gradient(180deg,var(--on1),var(--on2))} .slot.sel .num{color:var(--accent)}
.slot.playing .led{background:var(--play);box-shadow:0 0 6px var(--play)}
.slot .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--play);width:0}

/* ---------- view & mode keys ---------- */
#view{flex:1;min-height:0;position:relative;overflow:hidden}
#soundChip{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:5;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;height:42px}
#tabs button{height:40px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  font:600 13px var(--font-ui);color:var(--print);display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;white-space:nowrap;min-width:0}
#tabs button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
#tabs button.on{color:var(--ink)} #tabs button.on::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* ---------- knobs, selectors, faders ---------- */
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:80px;gap:6px 4px;flex:none}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;min-width:0;padding:3px 2px;border-radius:4px;position:relative}
.knob svg{width:48px;height:48px;display:block}
.knob .kr{fill:none;stroke:#0b0b0c;stroke-width:4;stroke-dasharray:75 100;stroke-linecap:round}
.knob .kv{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 2px var(--accent-glow))}
.knob .kb{fill:url(#knobFace);stroke:#060607;stroke-width:1}
.knob .ki{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.knob .kval{font:400 11px var(--font-lcd);color:var(--ink);white-space:nowrap;height:13px;line-height:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.knob .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;line-height:13px}
.knob.mini svg{width:30px;height:30px}.knob.mini .kval,.knob.mini .klab{display:none}
.nf{outline:2px solid var(--accent)!important;outline-offset:-2px}
.ne{outline:2px solid var(--play)!important;outline-offset:-2px;background-color:rgba(83,209,141,.08)}
.knob.nf,.knob.ne,.selr.nf,.selr.ne,.fader.nf,.fader.ne{border-radius:4px}
.knob.drag .kv{stroke:var(--accent-hi)}
.knob.autoed .klab{color:var(--accent)}
.knob.blank{visibility:hidden}
.selr{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 2px;border-radius:8px;min-width:0;touch-action:none}
.selr .sw>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;line-height:1.2}
.selr .sw{height:34px;width:100%;max-width:72px;border-radius:3px;background:var(--bg);border:1px solid #000;box-shadow:inset 0 1px 6px rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;
  font:400 11.5px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;margin-top:9px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 0;min-height:0;width:100%;max-height:calc(100cqw * 1.45);margin:auto 0}
.pad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;
  box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07),inset 0 -1px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:space-between;padding:7px 8px 15px;position:relative;touch-action:none;min-width:0;min-height:0;overflow:hidden}

.pad.kp .nm{font:500 14px var(--font-lcd);text-transform:none}
.pad.kroot .pn{color:var(--accent)} .pad.kroot::after{background:color-mix(in srgb,var(--pc) 70%,#101012)}
.pad.kout .nm{color:var(--mute)} .pad.kout{background:linear-gradient(180deg,#2b2b2f,#232326)}
.pad.kchord .nm{font-size:13px;letter-spacing:-.01em}
.pad.klatch::after{background:var(--pc);box-shadow:0 0 8px var(--pc)} .pad.klatch .pn{color:var(--accent)} .pad.kprog .pn{color:var(--accent)}
.pad.kprog::before{content:"";position:absolute;inset:0;border-radius:2px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent);pointer-events:none}
/* ---------- timeline ---------- */

.spads{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:36px;gap:6px 5px;flex:none}
.spad{--pc:#888;border-radius:3px;background:linear-gradient(180deg,#323237,#28282c 60%,#242428);border:1px solid #070708;box-shadow:0 3px 0 #050506,inset 0 1px 0 rgba(255,255,255,.07);

.console.slideL{animation:slideL .14s ease-out}.console.slideR{animation:slideR .14s ease-out}

    this.host.cpuMs += Date.now() - t0; this.host.cpuBlocks++; return true; }

registerProcessor('tf-engine', TFProc);`;

/* ================= constants & utils ================= */

  { id: 'arctic', name: 'Arctic', accent: '#8fd6ff', ink: '#04192a', body: ['#1b1d21', '#23262b', '#393d45', '#2a2d33', '#252930'], scr: ['#090b0e', '#101318', '#181c22', '#20252c', '#2a3039', '#13161b', '#929aa6', '#525a66'] },

    m.el.style.height = (f * 100).toFixed(1) + '%'; m.el.style.background = db > 0 ? COL.rec : db > -6 ? COL.accent : COL.play; }
