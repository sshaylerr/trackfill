<title>Trackfill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/*@FONTS@*/
/* Trackfill hardware: a matte charcoal body with rubber keys, backlit pads and knobs; data lives in recessed screens.
   Layout is fixed like a device: every region has a set size, nothing wraps, text truncates, numbers use fixed-width digits. */
:root{
  color-scheme: dark;
  /* body & controls */
  --body:#1c1c1f; --body2:#242428; --keyhi:#3b3b41; --keylo:#2a2a2f; --edge:#09090a; --print:#a29d93; --led-off:#3a2f2b;
  /* screen (also used by canvas drawing) */
  --bg:#0a0a0b; --panel:#111113; --raised:#19191c; --raised2:#222226; --line:#2c2b30; --ink:#ece8e0; --mute:#9b968d; --dim:#56534e; --sheet:#141416; --glow:#26262b;
  /* signal colors */
  --accent:#f2b544; --accent-ink:#241803;
  /* shades of the accent, so a theme only needs to set --accent and --accent-ink */
  --accent-hi:color-mix(in srgb,var(--accent) 62%,#fff); --accent-lo:color-mix(in srgb,var(--accent) 72%,#000); --accent-deep:color-mix(in srgb,var(--accent) 34%,#000);
  --accent-ring:color-mix(in srgb,var(--accent) 52%,#111); --accent-glow:color-mix(in srgb,var(--accent) 55%,transparent);
  --on1:color-mix(in srgb,var(--accent) 22%,#38362f); --on2:color-mix(in srgb,var(--accent) 16%,#2a2722); --rec:#e5483d; --play:#53d18d; --play-ink:#0a1a11;
  --font-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lcd:"Figtree", system-ui, sans-serif;   /* values: same family as the UI, lighter weight, fixed-width digits */
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box;overscroll-behavior:none;background:#0b0b0c}   /* what iOS shows in any strip outside the page (it keeps the colour it saw at launch): dark, so it reads as the phone's edge */
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overscroll-behavior:none;background:var(--body) radial-gradient(140% 70% at 50% 0%,var(--glow) 0%,var(--body) 60%);color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.lcd{font-family:var(--font-lcd);font-variant-numeric:tabular-nums}
body{font-variant-numeric:tabular-nums}
#app{height:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(8px,env(safe-area-inset-top,0px)) max(6px,env(safe-area-inset-bottom,0px))}

/* ---------- rubber keys ---------- */
.key,.tb{height:34px;min-width:34px;padding:0 10px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);
  box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);color:var(--ink);font:600 13px/1 var(--font-ui);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none;position:relative;overflow:hidden;text-overflow:ellipsis}
.key:active,.tb:active,.key.down{transform:translateY(1px);box-shadow:0 1px 0 #050506,inset 0 1px 0 rgba(255,255,255,.05)}
.key.on{color:var(--accent);background:linear-gradient(180deg,var(--on1),var(--on2))}
.key.warn{color:var(--rec)}

.keys{display:inline-flex;gap:4px;flex:none}

.btn{height:36px;padding:0 12px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.09);
  font:600 13px var(--font-ui);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-width:0;overflow:hidden}
.btn.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 2px 0 var(--accent-deep)}
.btn.warn{color:var(--rec)}
.btn.sm{height:32px;padding:0 9px;font-size:12px}
.btn.xs{height:28px;padding:0 8px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.4}

/* ---------- screens ---------- */
.scr{background:var(--bg);border:1px solid #000;border-radius:5px;box-shadow:inset 0 2px 10px rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden}

  display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lcdbox span{overflow:hidden;text-overflow:ellipsis}

/* ---------- transport ---------- */

.tb{height:40px;padding:0 9px;border-radius:4px}
.tb.ic{padding:0;width:38px;min-width:38px}
#bPlay.on{color:var(--play)} #bPlay.on::after,#bRec.on::after,#bRec.armed::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
#bPlay.on::after{background:var(--play);box-shadow:0 0 6px var(--play)}
#bRec{color:var(--rec)} #bRec.armed::after{background:var(--rec);opacity:.6} #bRec.on::after{background:var(--rec);box-shadow:0 0 8px var(--rec);animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.35}}
#bLoop{width:56px;flex-direction:column;gap:2px;line-height:1} #bLoop b{font:500 15px var(--font-ui);color:var(--ink)} #bLoop small{font-size:9px;color:var(--print);text-transform:uppercase;letter-spacing:.04em}
#bTempo{width:56px;flex-direction:column;gap:2px;line-height:1}
#bTempo.clk::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn:disabled{opacity:.32;pointer-events:none} .clipline b{color:var(--accent);font-weight:600} .lcdbox.edr{display:flex;align-items:center;justify-content:center;height:36px;font:500 12px var(--font-lcd);color:var(--accent)}
.grid.swapping .pad:not(.sel){animation:swapPulse 1s ease-in-out infinite alternate} @keyframes swapPulse{from{box-shadow:0 3px 0 #050506,inset 0 0 0 1px transparent}to{box-shadow:0 3px 0 #050506,inset 0 0 0 1px var(--accent-ring)}}
.synDev .devHead{gap:5px;padding:0} .engKey{flex:none;align-self:stretch;min-height:28px;padding:0 4px 0 2px;background:none;border:0;display:flex;align-items:center;justify-content:center;gap:4px;color:var(--d-ink)}
.engKey b{font:800 15px/1 var(--font-ui);letter-spacing:.12em;margin-right:-.12em;text-transform:uppercase;display:block} .engKey .car{font-size:9px;line-height:1;opacity:.7;display:block}
.presetLcd{flex:1;min-width:0;height:28px;border-radius:3px;background:var(--d-scr);border:1px solid #000;box-shadow:inset 0 1px 5px rgba(0,0,0,.8);display:flex;align-items:center;gap:8px;padding:0 9px;text-align:left}
.presetLcd span{flex:1;min-width:0;font:500 14px var(--font-lcd);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .presetLcd i{font:500 10px var(--font-lcd);font-style:normal;color:var(--mute);flex:none}
.synDev .pstep{flex:none;width:28px;min-width:28px;height:28px;padding:0}
.saveRow{display:flex;gap:6px;align-items:center} .saveRow .textin{flex:1} .saveRow .btn{flex:none;height:34px}
.lsub{margin-left:auto;font:400 12px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%} .lsub.warn{color:var(--rec)}
/* drum faceplate: same frame as the synths, with the More like this / slots row in the tabs' place */
.drumRow{display:grid!important;grid-template-columns:2.2fr repeat(4,1fr)} .drumRow .key{width:100%;padding:0 4px} .drumRow .likeKey{color:var(--d-ring)} .drumRow .slotKey.empty{opacity:.35} .drumDev .knob.locked .klab::after{content:' 🔒';font-size:9px}
.dev.synDev{flex:1 1 auto;min-height:0;padding:8px 8px 6px;gap:6px;border-radius:5px} .synDev::before,.synDev::after{display:none}
.synDev[data-eng="analog"]{border-left:9px solid #5b3418;border-right:9px solid #5b3418;border-image:linear-gradient(180deg,#7a4a26,#4a2a14 40%,#6b3f20 70%,#3e2310) 1;border-top:1px solid #000;border-bottom:1px solid #000}
.synDev .devHead{height:26px;padding:0 2px} .synDev .disp{background:var(--d-scr)} .synDev .synTabs .key{background:linear-gradient(180deg,#2a2826,#1d1c1a)} .synDev .synTabs .key.on{color:var(--d-ring)}
.synDev .knob .kb{stroke:#0a0908} .synDev .lcdbox.synInfo{background:var(--d-scr)}
#view.short .synDev .devHead{display:none} #view.short .synDev{padding:4px 5px 3px;gap:3px} #view.short .synTabs,#view.short .synTabs .key{height:26px}
#view.tiny .synDev .disp{min-height:0} .synDev .disp.gone canvas{visibility:hidden} #view.short .kgrid.synGrid{grid-auto-rows:54px;gap:2px 4px} #view.short .synGrid .knob svg{width:34px;height:34px} #view.short .synGrid .selr{padding-top:2px} #view.short .synGrid .selr .sw{height:26px} #view.tiny .soundView{gap:5px}
.mapRow .mchip{flex:0 1 auto;min-width:0;overflow:hidden;font-size:12px;padding:0 7px} .mapRow .madd{flex:none;padding:0 10px}
.mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapHint{flex:1;min-width:0;display:flex;align-items:center;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.mchip b{font-weight:500;font-family:var(--font-lcd)} .madd{flex:none} .mapTip{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end;font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.srcbtn{display:flex;align-items:center;gap:7px;justify-content:center} .sdot{width:9px;height:9px;border-radius:50%;flex:none}
.synPages{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))} .synPages .key{width:100%;padding:0 2px;font-size:12px;white-space:nowrap} @media (max-width:400px){.synPages .key{font-size:10.5px;letter-spacing:-.02em}}
.synTabs{display:flex;gap:4px;height:30px;flex:none} .synTabs .key{flex:1;height:30px;padding:0 4px;font-size:12px;min-width:0} .synInfo{flex:1;display:flex;align-items:center;padding:0 10px;font:500 11.5px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcKey{flex:none;padding:0 8px} .mapKey{flex:none;padding:0 8px}
/* Map's rows take exactly the space of what they replace (page keys, the faceplate's preset line), so nothing moves */
.mapAmt.param{padding:4px 9px 0;display:flex;flex-direction:column;justify-content:center;gap:4px;overflow:hidden} .mapAmt.param .ptrack{margin-top:0;height:4px} .soundView>.mapRow{height:30px} .synDev>.mapRow{height:28px} .mapRow>.key,.mapRow>.lcdbox,.mapRow .mapAmt{height:100%;min-height:0} .synDev>.mapRow .key{font-size:11.5px}
.mapBar{display:flex;flex-direction:column;gap:4px;flex:none} .mapRow{display:flex;gap:4px;height:34px;align-items:stretch;min-width:0} .mapRow::-webkit-scrollbar{display:none}
.mapLab{flex:0 1 auto;min-width:60px;max-width:120px;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;padding:0 8px;font:500 12px var(--font-lcd);color:var(--accent);white-space:nowrap}
.mchip{flex:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap} .mchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.msrcs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0} .msrcs::-webkit-scrollbar{display:none} .mdone{margin-left:auto;flex:none}
.mapAmt{flex:1;min-width:0;height:100%} .mapAmt .prow{font-size:11px} .mapRow .key.mx{color:var(--rec)}
.knob .km{fill:none;stroke-width:2.2;stroke-linecap:round;opacity:.95}
.synGrid .modded .klab::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:1px}
.synGrid .maptgt{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} .g4 .btn{padding:0 6px;min-width:0}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px} .g5 .btn{padding:0 4px;min-width:0}
.btn.theme{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px} .btn.theme.on{background:linear-gradient(180deg,var(--on1),var(--on2));color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.swd{width:12px;height:12px;border-radius:50%;flex:none;background:var(--sa);box-shadow:0 0 0 2px var(--sb),0 0 6px var(--sa)}
/* pad styles: dark (default), tinted with the pad's colour, or fully coloured */
body[data-pads="tint"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 20%,#323237),color-mix(in srgb,var(--pc) 13%,#28282c) 60%,color-mix(in srgb,var(--pc) 10%,#242428))}
body[data-pads="bright"] .pad:not(.empty){background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 62%,#3a3a3f),color-mix(in srgb,var(--pc) 48%,#2a2a2e))} body[data-pads="bright"] .pad:not(.empty) .nm,body[data-pads="bright"] .pad:not(.empty) .pn{color:#111;text-shadow:0 1px 0 rgba(255,255,255,.2)}
body[data-pads="bright"] .pad:not(.empty)::after{background:color-mix(in srgb,var(--pc) 40%,#000)} body[data-pads="bright"] .pad.hit::after,body[data-pads="bright"] .pad.held::after{background:#fff}
body[data-pads="tint"] .pad.hit,body[data-pads="bright"] .pad.hit,body[data-pads="tint"] .pad.held,body[data-pads="bright"] .pad.held{filter:brightness(1.3)}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px} .g6 .btn{padding-left:0;padding-right:0;min-width:0}
.btn.wide{width:100%}
.btn.prow{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 10px;text-align:left;width:100%;margin-bottom:6px;height:auto;min-height:50px;padding:8px 12px}
.btn.prow b{font-weight:600;font-size:15px} .btn.prow span{font-size:12px;color:var(--mute);justify-self:end} .btn.prow i{grid-column:1/-1;font-style:normal;font:400 12px var(--font-lcd);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.prow.on span,.btn.prow.on i{color:inherit;opacity:.8}
#bTempo b{font:500 14px var(--font-lcd);color:var(--accent)}
#bTempo small{font-size:9px;color:var(--print)}
#bPanel.on{color:var(--accent)}
.spacer{flex:1}
#meter{flex:none;display:grid;grid-template-columns:minmax(0,1fr) 60px 30px 32px;gap:6px;align-items:center;height:12px;cursor:pointer}
#meter .bars{display:flex;flex-direction:column;gap:2px}
#meter .bar{height:3px;border-radius:2px;background:#0b0b0c;overflow:hidden}
#meter .bar i{display:block;height:100%;width:100%;transform:scaleX(0);background:var(--play);transform-origin:left;will-change:transform}   /* its own layer: moving it repaints nothing */
#meter .bar i.hot{background:var(--accent)}
#meter .cpu{font-size:8.5px;color:var(--print);text-align:right;white-space:nowrap}
#meter .cpu.hot{color:var(--accent)} #meter .cpu.busy::after{content:' ·';color:var(--accent)}
#meter .clip{height:12px;border-radius:3px;background:#0b0b0c;border:1px solid #000;font:700 7px var(--font-lcd);color:var(--dim);display:flex;align-items:center;justify-content:center}
#meter .clip.on{background:var(--rec);color:#2b0707}
#meter .mon{height:12px;border-radius:3px;background:#0b0b0c;border:1px solid #000;font:700 7px var(--font-lcd);color:var(--dim);display:flex;align-items:center;justify-content:center} #meter .mon.on{background:var(--accent);color:#1a1205}

/* ---------- scene keys ---------- */
#scenes{display:flex;gap:6px;overflow-x:auto;flex:none;height:50px;scrollbar-width:none;padding-bottom:2px}
#scenes::-webkit-scrollbar{display:none}
.slot{flex:0 0 56px;height:47px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 6px;position:relative;overflow:hidden;text-align:left}
.slot .srow{display:flex;align-items:baseline;gap:4px;max-width:calc(100% - 8px);min-width:0;height:15px}
.slot .num{font:500 14px/14px var(--font-lcd);flex:none}

/* ---------- view & mode keys ---------- */

#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;height:42px}
#tabs button{height:40px;border-radius:4px;background:linear-gradient(180deg,var(--keyhi),var(--keylo));border:1px solid var(--edge);box-shadow:0 2px 0 #050506,inset 0 1px 0 rgba(255,255,255,.08);
  font:600 13px var(--font-ui);color:var(--print);display:flex;align-items:center;justify-content:center;gap:5px;overflow:hidden;white-space:nowrap;min-width:0}
#tabs button::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--led-off)}
#tabs button.on{color:var(--ink)} #tabs button.on::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}

/* ---------- knobs, selectors, faders ---------- */

.knob .kval{font:400 11px var(--font-lcd);color:var(--ink);white-space:nowrap;height:13px;line-height:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.knob .klab{font:500 11.5px var(--font-ui);color:var(--print);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;height:13px;line-height:13px}
.knob.mini svg{width:30px;height:30px}.knob.mini .kval,.knob.mini .klab{display:none}
.nf{outline:2px solid var(--accent)!important;outline-offset:-2px}
.ne{outline:2px solid var(--play)!important;outline-offset:-2px;background-color:rgba(83,209,141,.08)}
.typeready{outline:2px solid var(--accent)!important;outline-offset:-2px;border-radius:4px}

<script>
'use strict';

const HOST_SRC = "@HOST_SRC@", WORKLET_SRC = HOST_SRC + `
class TFProc extends AudioWorkletProcessor {

    const fail = e => this.port.postMessage({ t: 'err', msg: String(e && e.message || e) });

      if (o.processorOptions.warm) { const t0 = Date.now(); try { tfWarmEngine(mod, sampleRate); } catch (e) {} this.port.postMessage({ t: 'warmed', ms: Date.now() - t0 }); }
      const inst = new WebAssembly.Instance(mod, {});
      this.host = new TFHost(inst.exports, sampleRate, m => this.port.postMessage(m));
      this.port.onmessage = e => { try { this.host && this.host.msg(e.data); } catch (err) { this.port.postMessage({ t: 'err', msg: 'while handling "' + (e.data && e.data.t) + '": ' + String(err && err.message || err) + ((err && err.stack || '').split('\\n')[1] || '') }); } };

  process(ins, outs) { const o = outs[0]; if (!this.host || !o || !o[0]) return true; const t0 = Date.now();

    this.host.cpuMs += Date.now() - t0; this.host.cpuBlocks++; return true; }

/* ================= constants & utils ================= */
const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const PAD_COLORS = ['#e8916c', '#e6c162', '#a3d27d', '#6fcac1', '#78a9ea', '#ab8ee8', '#e486bb', '#cdbda8'];
// the grid: straight, triplet and dotted values (in ticks, 96 to a beat); 0 is off
const SNAPS = [{ t: 96, l: '1/4', g: 'Straight' }, { t: 48, l: '1/8', g: 'Straight' }, { t: 24, l: '1/16', g: 'Straight' }, { t: 12, l: '1/32', g: 'Straight' }, { t: 6, l: '1/64', g: 'Straight' },
  { t: 64, l: '1/4T', g: 'Triplet' }, { t: 32, l: '1/8T', g: 'Triplet' }, { t: 16, l: '1/16T', g: 'Triplet' }, { t: 8, l: '1/32T', g: 'Triplet' },
  { t: 144, l: '1/4D', g: 'Dotted' }, { t: 72, l: '1/8D', g: 'Dotted' }, { t: 36, l: '1/16D', g: 'Dotted' }, { t: 0, l: 'Off', g: '' }];
const snapName = t => (SNAPS.find(s => s.t === t) || SNAPS[2]).l;
/* A grid position near t. The grid counts from each bar line, so a dotted value (which doesn't divide a bar) starts again on every bar:
   1/8D gives the 3-3-2 pattern. how: 'round' (nearest), 'floor' (at or before). The next bar line is always a grid position too. */
function gridQ(t, s, how = 'round') { if (!s) return fixT(t); const b = Math.floor(t / BAR + 1e-9) * BAR, r = t - b;
  if (how === 'floor') return fixT(b + Math.min(Math.floor(r / s + 1e-9) * s, Math.floor((BAR - 1e-6) / s) * s));
  const q = b + Math.min(Math.round(r / s) * s, Math.floor((BAR - 1e-6) / s) * s); return fixT(Math.abs(b + BAR - t) < Math.abs(t - q) ? b + BAR : q); }
function openSnap() { const tl = UI.tl; openSheet('Grid', card => { const st = h('div', 'stack'); card.append(st);
  for (const grp of ['Straight', 'Triplet', 'Dotted', '']) { st.append(h('div', 'sec', grp || 'No grid')); const g = h('div', 'g5 hrow');   // keys, like the Edit sheet's
    for (const s of SNAPS.filter(x => x.g === grp)) g.append(btn(s.t ? s.l : 'Off', () => { tl.snap = s.t; savePrefs(); closeSheet(); }, 'btn' + (tl.snap === s.t ? ' on' : ''))); st.append(g); } }); }
const KEY_HI = 24, KEY_ROWS = 49, KEY_H = 24, LABEL_W = 50, RULER_H = 20, STRIP_H = 28;
// a chopped pad's notes carry a slice number; in Keys mode its rows (and the 16 pads) become its slices
const hasSound = p => !!(p && (p.src === 'synth' ? p.syn : p.sample));   // a pad makes sound: a sample, or a synth patch
const chopOf = pi => { const p = P.pads[pi]; return p && p.src !== 'synth' && p.sample && p.chop && p.chop.on && p.chop.pts.length ? p.chop : null; };
// where a slice starts: in beats of the original loop when its tempo is known, otherwise in seconds

  name: p => KR.chop() ? 'Slice ' + (KR.row(p) + 1) : noteName(p) };
const $ = s => document.querySelector(s);

const posStr = t => `${Math.floor(t / BAR) + 1}.${Math.floor(t % BAR / BEAT) + 1}.${Math.floor(t % BEAT / 24) + 1}`;

function offGrid(t) { const g = UI.tl.snap || 24, off = t - gridQ(t, g), ms = off * spt() * 1000; return Math.abs(ms) < 0.05 ? 'on grid' : (ms > 0 ? '+' : '−') + Math.abs(ms).toFixed(1) + ' ms off grid'; }
const curveFrac = tfCurve, valueAt = tfValueAt;
const duckerCount = () => P.chans.reduce((n, c) => n + c.fx.filter(f => f.type === FX_TYPES.DUCK).length, 0);

/* ================= state ================= */
let P = null;
const UI = { follow: true, mon: { mode: 0, phones: '' }, theme: 'amber', padStyle: 'dark', view: 'pads', bank: 0, pad: 0, scene: 0, keys: false, oct: 0, keyCell: 0, panel: false, shift: false, fine: 0, mirror: false, sheet: false,
  tl: { mode: 'bank', lane: 'notes', target: null, zoom: null, sx: 0, sy: null, by: 0, rv: 16, kh: 24, snap: 24, sel: null, ms: null, selMode: false, box: null, selPt: -1, draw: false, cursor: { t: 0, row: 0, v: .5 } },
  snd: 0, slice: 0, click: 'rec', countIn: 1, clickVol: .5, mixPage: 0, mixSel: 0, fxCh: 0, fxSlot: 0, fxBack: 'mix', regs: [], autoRec: null, haptics: true };

  { id: 'rose', name: 'Rose', accent: '#ff8fb3', ink: '#2e0a17', body: ['#1e1b1d', '#262225', '#3e383c', '#2e292c', '#28232a'], scr: ['#0b0a0b', '#131113', '#1b181a', '#241f22', '#302a2e', '#161315', '#a0939a', '#5a5056'] },
  { id: 'acid', name: 'Acid', accent: '#c6f14b', ink: '#1b2402', body: ['#1b1c19', '#232420', '#3a3b35', '#2a2b27', '#25261f'], scr: ['#0a0b09', '#111210', '#191a17', '#21221e', '#2b2d28', '#141512', '#9a9a8c', '#555649'] },
  { id: 'arctic', name: 'Arctic', accent: '#8fd6ff', ink: '#04192a', body: ['#1b1d21', '#23262b', '#393d45', '#2a2d33', '#252930'], scr: ['#090b0e', '#101318', '#181c22', '#20252c', '#2a3039', '#13161b', '#929aa6', '#525a66'] },
  { id: 'mono', name: 'Mono', accent: '#ece8e0', ink: '#1a1a1a' },

const BODY_VARS = ['body', 'body2', 'keyhi', 'keylo', 'glow'], SCR_VARS = ['bg', 'panel', 'raised', 'raised2', 'line', 'sheet', 'mute', 'dim'];
function applyTheme() {
  const th = THEMES.find(x => x.id === UI.theme) || THEMES[0], st = document.documentElement.style;
  st.setProperty('--accent', th.accent); st.setProperty('--accent-ink', th.ink);
  if (window.TF_SUPPORT && TF_SUPPORT.soft.includes('colours')) {   // older browsers can't mix colours in CSS: the theme's shades are mixed here instead
    const rgb = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16)), mix = (a, pct, b) => { const A = rgb(a), B = rgb(b); return 'rgb(' + A.map((v, i) => Math.round(v * pct + B[i] * (1 - pct))).join(',') + ')'; };
    const a = th.accent; [['accent-hi', .62, '#ffffff'], ['accent-lo', .72, '#000000'], ['accent-deep', .34, '#000000'], ['accent-ring', .52, '#111111'], ['on1', .22, '#38362f'], ['on2', .16, '#2a2722']].forEach(([k, p, b]) => st.setProperty('--' + k, mix(a, p, b)));
    const A = rgb(a); st.setProperty('--accent-glow', `rgba(${A.join(',')},.55)`); }
  BODY_VARS.forEach((k, i) => th.body ? st.setProperty('--' + k, th.body[i]) : st.removeProperty('--' + k));
  SCR_VARS.forEach((k, i) => th.scr ? st.setProperty('--' + k, th.scr[i]) : st.removeProperty('--' + k));
  document.body.dataset.pads = UI.padStyle || 'dark'; readColors();
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = th.body ? th.body[0] : '#1c1c1f';
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
function btn(label, fn, cls = 'btn') { const b = h('button', cls, label); b.onclick = fn; return b; }
function seg(labels, active, fn) { const s = h('div', 'keys'); labels.forEach((l, i) => { const b = h('button', 'key sm' + (i === active ? ' on' : ''), l); b.onclick = () => fn(i); s.append(b); }); return s; }

/* ================= samples ================= */
// { id, name, sr, ch, frames, data: Int16Array (interleaved), builtin?, frz?, added }
const SAMPLES = new Map();
// the current kit is built at startup; other built-ins (break, classic kit) are built the first time they are needed
function buildBuiltin(key) { const k = ALL_BUILTINS.find(x => x[0] === key); if (!k || SAMPLES.has('b:' + key)) return; const s = buildKitSample(k[0], k[1]); SAMPLES.set(s.id, s); }
function buildBuiltins(all) { for (const [k] of all ? ALL_BUILTINS : KIT) buildBuiltin(k); }
// built-in sounds are synthesized; the bigger ones are kept on the device after the first time so launching stays quick
const builtinVer = k => SOUNDS[k].toString().length;
async function warmBuiltins(proj) {
  for (const p of proj.pads) { const id = p.sample; if (!id || !id.startsWith('b:') || SAMPLES.has(id)) continue; const key = id.slice(2), k = ALL_BUILTINS.find(x => x[0] === key); if (!k) continue;
    const ck = `bc:${key}:${builtinVer(key)}`, c = await DB.get('kv', ck);
    if (c && c.data && c.frames) { SAMPLES.set(id, Object.assign(c, { name: k[1], builtin: true })); continue; }
    const s = buildKitSample(key, k[1]); SAMPLES.set(id, s); if (s.frames > KIT_SR) DB.put('kv', ck, { id, sr: s.sr, ch: s.ch, frames: s.frames, data: s.data });
    await new Promise(r => setTimeout(r, 0)); }   // let the screen breathe between sounds
}
function newJungle() { if (T.playing) stop(); pushUndo('all'); closeSheet(); toast('Building the Liquid jungle kit…');
  setTimeout(async () => { const np = jungleProject(); await warmBuiltins(np); await projNew(np); renderAll(); toast('Liquid jungle · F minor · 174 BPM'); }, 60); }
function newStress(two) { if (T.playing) stop(); pushUndo('all'); closeSheet(); toast('Building the stress test…');
  setTimeout(async () => { const np = two ? stress2Project() : stressProject(); await warmBuiltins(np); await projNew(np); renderAll(); toast(two ? 'Stress test 2 loaded: scene 1 is a full mix, scene 2 the worst case' : 'Stress test loaded'); }, 60); }
const grSrc = p => p && p.src === 'synth' && p.syn && p.syn.eng === 'gr' && p.syn.gr && p.syn.gr.src || null;   // a granular pad's source sound
function ensureBuiltinsFor(proj) { if (proj === P) P.pads.forEach((p, i) => { if (p.drum && (p.src === 'drum' || (p.sample && p.sample.startsWith('d:')))) { p.sample = null; p.sample = drumSampleId(i); } });   // drums are rendered again from their settings
  for (const p of proj.pads) { if (p.sample && p.sample.startsWith('b:')) buildBuiltin(p.sample.slice(2)); const g = grSrc(p); if (g && g.startsWith('b:')) buildBuiltin(g.slice(2)); } }
function addUserSample(name, sr, ch, data, extra) {
  const id = 'u:' + uid(), s = Object.assign({ id, name: tfName(name, 24) || 'Sound', sr, ch, frames: data.length / ch, data, added: Date.now() }, extra || {});
  SAMPLES.set(id, s); DB.put('samples', id, s); return id;
}
function deleteSample(id) { const s = SAMPLES.get(id); if (!s || s.builtin) return; SAMPLES.delete(id); DB.del('samples', id); UPQ.jobs = UPQ.jobs.filter(j => upKey(j) !== id); send({ t: 'sampleDel', key: id }); ENG.sent.delete(id); }
function interleave(chans, maxFrames) { const n = Math.min(chans[0].length, maxFrames), c = chans.length, o = new Int16Array(n * c);
  for (let i = 0; i < n; i++) for (let k = 0; k < c; k++) { const s = Math.max(-1, Math.min(1, chans[k][i])); o[i * c + k] = s < 0 ? s * 32768 : s * 32767; } return o; }

  if (s.data instanceof Int16Array) return s;
  if (s.chans) { const data = interleave(s.chans, s.chans[0].length); return { id: s.id, name: s.name, sr: s.sr, ch: s.chans.length, frames: s.chans[0].length, data, added: 0 }; }
  return null;

const usedSampleIds = () => { const u = new Set(); for (const p of P.pads) { if (p.sample) u.add(p.sample); if (p.frz) for (const k in p.frz) u.add(p.frz[k]); } for (const k of tableKeys()) if (!k.startsWith('w:')) u.add(k); for (const p of P.pads) { const g = grSrc(p); if (g) u.add(g); if (p.stx && p.wm !== 'Repitch') u.add(p.stx); } return u; };   // your own wavetables travel with the project like samples

/* ================= storage ================= */
const DB = { db: null, ok: false,
  async open() { try { this.db = await new Promise((res, rej) => { const r = indexedDB.open('trackfill', 2); r.onupgradeneeded = () => { const d = r.result; for (const n of ['kv', 'samples', 'projects', 'pmeta']) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }; r.onsuccess = () => { const d = r.result; d.onversionchange = () => d.close(); res(d); }; r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked')); }); this.ok = true; } catch (e) { this.db = null; this.ok = false; } },
  req(store, mode, fn) { return new Promise(res => { if (!this.db) return res(undefined); try { const tx = this.db.transaction(store, mode), q = fn(tx.objectStore(store)); tx.oncomplete = () => res(q && q.result); tx.onerror = tx.onabort = () => res(undefined); } catch (e) { res(undefined); } }); },
  get(store, key) { return this.req(store, 'readonly', s => s.get(key)); },
  // a write that doesn't land (storage full, or the browser refused) says so once a minute, so nobody thinks unsaved work is safe
  put(store, key, val) { return this.req(store, 'readwrite', s => s.put(val, key)).then(r => { if (r !== undefined || !this.db) return true; const t = Date.now(); if (t - (this.warned || 0) > 60000) { this.warned = t; toast('Couldn\'t save to this device (storage may be full). Save a backup from Projects.'); } return false; }); },
  del(store, key) { return this.req(store, 'readwrite', s => s.delete(key)); },
  all(store) { return this.req(store, 'readonly', s => s.getAll()).then(r => r || []); } };
/* ================= projects: autosaved songs, snapshots, templates =================
   'projects' holds each song (id → its data) and its snapshots ('snap:' + id → the last 5 versions, taken when it is opened);
   'pmeta' holds what the list shows (name, tempo, key, dates) so the list never has to load whole songs. Templates are songs marked as such. */
const PROJ = { id: null, created: 0 };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const projScenes = p => p.scenes.map((s, i) => Object.values(s.notes || {}).some(a => a && a.length) ? i : -1).filter(i => i >= 0);
function projMeta(p, kind = 'project', extra = {}) { return Object.assign({ name: p.name || 'Untitled', kind, bpm: p.bpm, key: p.key, scenes: projScenes(p).length, cols: projScenes(p).slice(0, 8).map(i => (p.scenes[i].color ?? i) % 8) }, extra); }

async function projCreate(p, kind = 'project') { const id = newId(), now = Date.now(); await DB.put('projects', id, { id, data: JSON.parse(JSON.stringify(p)) });
  await DB.put('pmeta', id, Object.assign(projMeta(p, kind), { id, created: now, modified: now })); return id; }

async function projOpen(id, quiet) { const rec = await DB.get('projects', id), meta = await DB.get('pmeta', id); if (!rec || !rec.data) { toast('That project could not be read'); return false; }
  if (T.playing) stop(); if (PROJ.id && PROJ.id !== id) await projSave();
  const sk = 'snap:' + id, sn = (await DB.get('projects', sk)) || { id: sk, list: [] };
  if (!sn.list.length || sn.list[sn.list.length - 1].at !== (meta && meta.modified)) { sn.list.push({ at: meta ? meta.modified : Date.now(), data: rec.data }); while (sn.list.length > 5) sn.list.shift(); await DB.put('projects', sk, sn); }

/* ================= meter, transport wiring & frame loop ================= */
const METER = { l: 0, r: 0, clip: false };
/* Every meter (output, mixer strips, devices, analyzer) works the same way: it rises at once to the peak of each report, then falls 24 dB a
   second, measured in time rather than frames, so it reads the same on any screen. Reports wait until the moment they are heard (the same
   output-latency correction as the playhead), so the meters move with the sound rather than ahead of it. */
const METQ = [], METER_FALL = 24;
const FLQ = [], flashOne = f => flashPad(f.v & 255, (f.v >> 8) - 1);
function meterTake(r) { METER.l = Math.max(METER.l, r.pk[0]); METER.r = Math.max(METER.r, r.pk[1]); if (r.pk[0] > 1 || r.pk[1] > 1) METER.clip = true;
  const cm = r.cm || []; if (UI.view === 'mix') for (const m of STRIP_METERS) for (let k = 0; k < 2; k++) m.v[k] = Math.max(m.v[k], cm[m.c * 2 + k] || 0);
  if (r.sc) onScope(r.sc); }
function meterFeed(dt) { const live = ctx && ctx.state === 'running', heard = live ? heardTime() + DISP_LEAD : Infinity;
  while (METQ.length && (METQ[0].at <= heard || METQ[0].at - heard > .5)) meterTake(METQ.shift());
  while (FLQ.length && (FLQ[0].at <= heard || FLQ[0].at - heard > .5)) flashOne(FLQ.shift());   // (a report from far ahead means the clock jumped: show it now)
  const g = Math.pow(10, -METER_FALL * dt / 20), z = v => v * g < 1e-3 ? 0 : v * g;   // under -60 dB nothing shows: done, and the screen can rest
  METER.l = z(METER.l); METER.r = z(METER.r); for (const m of STRIP_METERS) { m.v[0] = z(m.v[0]); m.v[1] = z(m.v[1]); } }
const meterEls = [...document.querySelectorAll('#meter .bar i')], clipEl = document.querySelector('#meter .clip'), cpuEl = document.querySelector('#meter .cpu');
let lastCpuDraw = 0;
const meterLast = [-1, -1];
function drawMeter() { [METER.l, METER.r].forEach((v, i) => { const db = v > 1e-5 ? 20 * Math.log10(v) : -99, f = Math.round(clamp((db + 48) / 48, 0, 1) * 200) / 200; if (f === meterLast[i]) return; meterLast[i] = f;   // write the style only when it changes
    meterEls[i].style.transform = `scaleX(${f})`; meterEls[i].classList.toggle('hot', db > -3); }); clipEl.classList.toggle('on', METER.clip);
  const n = performance.now(); if (n - lastCpuDraw > 400) { lastCpuDraw = n; const c = ENG.ready ? Math.round(REP.cpu * 100) : null; cpuEl.textContent = c == null ? 'CPU —' : `CPU ${c}%`; cpuEl.classList.toggle('hot', c != null && c > 60); } }

new ResizeObserver(() => { placeSheet(); const V = $('#view'), hh = V.clientHeight; V.classList.toggle('short', hh < 470); V.classList.toggle('tiny', hh < 360); if (UI.view === 'seq') sizeTL(); else if (UI.view === 'sound') { drawDisp(); drawSynDisp(); } else if (UI.view === 'mix') UI.regs.forEach(f => f.upd && f.upd()); if (UI.panel) updatePanel(); }).observe($('#view'));
let lastHeard = -1;
// the screen loop runs only while something moves (playback, sound, meters falling, a recent touch); wake() restarts it

    if (UI.view === 'seq') drawTLFrame();

}
